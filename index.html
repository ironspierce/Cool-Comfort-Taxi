<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Premium Jamaica Pickup</title>
    
    <meta name="theme-color" content="#002b36">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Cool%20Comfort%22,%22short_name%22:%22CoolComfort%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23002b36%22,%22theme_color%22:%22%23002b36%22}">
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --teal: #008080; --navy: #002b36; --gold: #ffcc00; --white: #ffffff; --light-bg: #f4f7f7; --text-color: #002b36; --border-color: #ddd; }
        body.dark { --teal: #4db6ac; --navy: #0e3b43; --white: #212121; --light-bg: #121212; --text-color: #e0e0e0; --border-color: #444; }

        body { font-family: 'Times New Roman', Times, serif; margin: 0; background: var(--light-bg); color: var(--text-color); -webkit-tap-highlight-color: transparent; transition: background 0.3s; }
        header { background: linear-gradient(135deg, var(--navy), var(--teal)); color: white; padding: 2.5rem 1rem; text-align: center; border-bottom: 5px solid var(--gold); }
        .motto { font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; color: var(--gold); font-weight: bold; }

        .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
        .booking-card { margin: -30px auto 30px; background: var(--white); padding: 2rem; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); border: 1px solid rgba(0,128,128,0.1); }

        .input-group { margin-bottom: 12px; position: relative; }
        .input-group i { position: absolute; left: 12px; top: 12px; color: var(--teal); }
        input, select { width: 100%; padding: 10px 10px 10px 35px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; box-sizing: border-box; background: var(--white); color: var(--text-color); font-family: 'Times New Roman', serif; }

        .gps-btn { background: var(--teal); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 15px; font-weight: bold; font-family: 'Times New Roman', serif; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        #map { width: 100%; height: 250px; border-radius: 10px; margin: 15px 0; display: none; border: 2px solid var(--teal); }
        .price-box { background: var(--light-bg); padding: 20px; border-radius: 10px; margin-top: 15px; display: none; text-align: center; border: 2px dashed var(--teal); }
        
        .currency-switch { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0; font-weight: bold; }
        .currency-switch input { display: none; }
        .currency-switch label { width: 40px; height: 20px; background: #ddd; border-radius: 10px; cursor: pointer; position: relative; }
        .currency-switch label::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; background: white; border-radius: 50%; transition: 0.3s; }
        .currency-switch input:checked + label { background: var(--gold); }
        .currency-switch input:checked + label::after { transform: translateX(20px); }

        .btn-book { background: var(--gold); color: var(--navy); padding: 1.2rem; border: none; font-weight: bold; width: 100%; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 1.2rem; font-family: 'Times New Roman', serif; display: flex; justify-content: center; align-items: center; gap: 10px; }

        .pending-section { margin-top: 25px; padding-top: 20px; border-top: 2px solid var(--gold); }
        .order-item { background: #fff; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 10px; position: relative; font-size: 0.9rem; }
        .order-item.dark-card { background: #2a2a2a; color: #fff; }
        .btn-delete { position: absolute; right: 10px; top: 10px; color: #ff4444; border: none; background: none; font-size: 1.2rem; cursor: pointer; }

        .mode-toggles { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .toggle-btn { padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border-color); cursor: pointer; font-family: 'Times New Roman', serif; }
        .toggle-btn.active { background: var(--teal); color: white; border: none; }

        footer { text-align: center; padding: 20px; font-size: 0.8rem; color: #777; }
    </style>
</head>
<body>

<header>
    <h1>COOL <span style="color:var(--gold)">COMFORT</span></h1>
    <div class="motto">PREMIUM • PUNCTUAL • PROFESSIONAL</div>
</header>

<div class="container">
    <div class="booking-card">
        <div class="mode-toggles">
            <button id="lBtn" class="toggle-btn active" onclick="setMode('light')">Light</button>
            <button id="dBtn" class="toggle-btn" onclick="setMode('dark')">Dark</button>
        </div>

        <button class="gps-btn" onclick="getLocation()"><i class="fa fa-location-dot"></i> CURRENT LOCATION</button>
        
        <div class="input-group">
            <i class="fa fa-map-pin"></i>
            <input type="text" id="pickup" placeholder="Pickup point" required>
        </div>
        <div class="input-group">
            <i class="fa fa-flag-checkered"></i>
            <input type="text" id="destination" placeholder="Destination" required>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <select id="pax" onchange="calc()">
                <option value="1">1 Person</option><option value="2">2 People</option>
                <option value="3">3 People (Group)</option><option value="4">4 People (Group)</option>
            </select>
        </div>

        <div id="map"></div>

        <div id="price-box" class="price-box">
            <div class="currency-switch">
                <span>USD</span>
                <input type="checkbox" id="curr" onchange="calc()">
                <label for="curr"></label>
                <span>JMD</span>
            </div>
            <h2 id="display-price">$0.00 USD</h2>
        </div>

        <button class="btn-book" onclick="book()"><i class="fab fa-whatsapp"></i> BOOK WITH PIERCE</button>

        <div class="pending-section">
            <h3 style="text-align:center">Pending Bookings</h3>
            <div id="order-list"></div>
        </div>
    </div>
</div>

<footer>&copy; 2026 Cool Comfort | Pierce Irons</footer>

<script>
    let map, ds, dr, geo, orders = [];

    function init() {
        const opts = { componentRestrictions: { country: "jm" } };
        new google.maps.places.Autocomplete(document.getElementById('pickup'), opts).addListener('place_changed', calc);
        new google.maps.places.Autocomplete(document.getElementById('destination'), opts).addListener('place_changed', calc);
        ds = new google.maps.DirectionsService();
        geo = new google.maps.Geocoder();
        dr = new google.maps.DirectionsRenderer({ map: new google.maps.Map(document.getElementById('map'), { zoom: 8, center: { lat: 18.1, lng: -77.3 } }) });
    }

    function calc() {
        const p = document.getElementById('pickup').value;
        const d = document.getElementById('destination').value;
        if (!p || !d) return;

        ds.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (res, stat) => {
            if (stat === 'OK') {
                dr.setDirections(res);
                document.getElementById('map').style.display = 'block';
                const km = res.routes[0].legs[0].distance.value / 1000;
                const rate = (document.getElementById('pax').value >= 3) ? 1.30 : 1.00;
                const usd = 10 + (km * rate);
                const isJmd = document.getElementById('curr').checked;
                document.getElementById('display-price').innerText = isJmd ? "$" + Math.round(usd * 156).toLocaleString() + " JMD" : "$" + usd.toFixed(2) + " USD";
                document.getElementById('price-box').style.display = 'block';
            }
        });
    }

    function book() {
        const p = document.getElementById('pickup').value, d = document.getElementById('destination').value, pr = document.getElementById('display-price').innerText;
        if(!p || !d) return alert("Fill in locations");
        
        const order = { id: Date.now(), p, d, pr, time: new Date().toLocaleTimeString() };
        orders.push(order);
        renderOrders();

        window.open(`https://wa.me/18763933246?text=${encodeURIComponent("Booking for Pierce:\nFrom: "+p+"\nTo: "+d+"\nQuote: "+pr)}`);
    }

    function renderOrders() {
        const list = document.getElementById('order-list');
        list.innerHTML = orders.length ? '' : '<p style="text-align:center; opacity:0.5">No pending rides.</p>';
        orders.forEach(o => {
            const item = document.createElement('div');
            item.className = `order-item ${document.body.classList.contains('dark') ? 'dark-card' : ''}`;
            item.innerHTML = `<button class="btn-delete" onclick="remove(${o.id})">&times;</button><b>${o.time}</b><br>${o.d}<br>${o.pr}`;
            list.appendChild(item);
        });
    }

    function remove(id) { orders = orders.filter(o => o.id !== id); renderOrders(); }

    function setMode(m) {
        document.body.className = m;
        document.getElementById('lBtn').className = m === 'light' ? 'toggle-btn active' : 'toggle-btn';
        document.getElementById('dBtn').className = m === 'dark' ? 'toggle-btn active' : 'toggle-btn';
        renderOrders();
    }

    function getLocation() {
        if (navigator.geolocation) navigator.geolocation.getCurrentPosition(pos => {
            geo.geocode({ location: { lat: pos.coords.latitude, lng: pos.coords.longitude } }, (res, stat) => {
                if (stat === "OK") { document.getElementById('pickup').value = res[0].formatted_address; calc(); }
            });
        });
    }

    window.onload = init;
</script>
</body>
</html>
