<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Premium All-Island Transport</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.paypal.com/sdk/js?client-id=BAA8P6X3C7B5W&merchant-id=26SBN3BDG55FQ&currency=USD"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places"></script>
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --teal: #004d4d; --glass: rgba(255, 255, 255, 0.08); --white: #ffffff; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: var(--white); line-height: 1.6; overflow-x: hidden; scroll-behavior: smooth; }

        .hero { position: relative; min-height: 100vh; width: 100%; background: linear-gradient(rgba(0,31,38,0.7), rgba(0,31,38,0.9)), url('Cover Photo.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 40px 20px; }
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 6vw, 3.5rem); margin: 0; letter-spacing: 4px; color: var(--gold); text-align: center; }
        .motto { text-transform: uppercase; letter-spacing: 5px; font-size: 0.8rem; margin-bottom: 30px; opacity: 0.8; text-align: center; }

        .booking-card { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); padding: clamp(20px, 5vw, 40px); border-radius: 28px; width: 100%; max-width: 600px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        #map { width: 100%; height: 300px; border-radius: 18px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }

        .input-group { margin-bottom: 12px; position: relative; display: flex; align-items: center; gap: 8px; }
        input { flex: 1; padding: 14px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; font-family: 'Montserrat', sans-serif; }
        
        .btn-action { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: 0.3s; margin-bottom: 15px; }
        .btn-action:hover { background: var(--gold); color: var(--navy); }
        .remove-stop { color: #ff6b6b; cursor: pointer; font-size: 1.2rem; }

        .price-box { background: rgba(212, 175, 55, 0.15); padding: 20px; border-radius: 18px; margin: 20px 0; border: 1px solid var(--gold); text-align: center; display: none; }
        .btn-book { background: var(--gold); color: var(--navy); padding: 18px; border: none; width: 100%; border-radius: 14px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 12px; }

        .section-padding { padding: 80px 20px; max-width: 1150px; margin: 0 auto; }
        .operator-card { display: flex; align-items: center; gap: 40px; background: linear-gradient(145deg, var(--teal), var(--navy)); padding: 45px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.08); }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--gold); object-fit: cover; }

        @media (max-width: 768px) { .operator-card { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>

<section class="hero">
    <h1>COOL COMFORT</h1>
    <div class="motto">Arrive Refined. Travel Defined.</div>
    
    <div class="booking-card">
        <div id="map"></div>
        
        <div id="location-fields">
            <div class="input-group">
                <input type="text" id="pickup" placeholder="Pickup Point">
                <i class="fa-solid fa-location-dot" style="color: var(--gold)"></i>
            </div>
            <div class="input-group destination-group">
                <input type="text" class="dest-input" placeholder="Destination">
                <i class="fa-solid fa-flag-checkered"></i>
            </div>
        </div>

        <button class="btn-action" onclick="addStop()"><i class="fa fa-plus"></i> Add Stop</button>

        <div class="input-group">
            <input type="tel" id="user-phone" placeholder="WhatsApp Number" oninput="calcFare()">
        </div>

        <div id="price-box" class="price-box">
            <div id="jmd-price" style="font-size: 2.2rem; font-weight: 700;">$0 JMD</div>
            <div id="usd-price" style="opacity:0.8;">≈ $0.00 USD</div>
            <div id="paypal-button-container" style="margin-top:20px;"></div>
        </div>

        <button class="btn-book" onclick="sendWhatsApp()"><i class="fab fa-whatsapp"></i> SECURE YOUR JOURNEY</button>
    </div>
</section>

<section class="section-padding">
    <div class="operator-card">
        <img src="image_16.png" alt="Pierce I." class="profile-img">
        <div style="flex: 1;">
            <h3 style="margin:0; font-size: 1.8rem; color:var(--gold);">Pierce I.</h3>
            <p style="font-weight:bold; font-size: 0.8rem; letter-spacing: 2px;">FOUNDER & LEAD OPERATOR</p>
            <p>Providing tailored transport where safety and punctuality are the foundation of every mile driven across Jamaica.</p>
        </div>
    </div>
</section>

<script>
    let map, ds, dr, geo;
    const EX_RATE = 156;

    function initMap() {
        const jm = { lat: 18.1096, lng: -77.2975 };
        map = new google.maps.Map(document.getElementById("map"), { zoom: 8, center: jm, disableDefaultUI: true, zoomControl: true });
        ds = new google.maps.DirectionsService();
        dr = new google.maps.DirectionsRenderer({ map, suppressMarkers: false });
        geo = new google.maps.Geocoder();

        setupAutocomplete(document.getElementById('pickup'));
        setupAutocomplete(document.querySelector('.dest-input'));
        initPayPal();
    }

    function setupAutocomplete(input) {
        const ac = new google.maps.places.Autocomplete(input, { componentRestrictions: { country: "jm" } });
        ac.addListener('place_changed', calcFare);
    }

    function addStop() {
        const container = document.getElementById('location-fields');
        const div = document.createElement('div');
        div.className = 'input-group destination-group';
        div.innerHTML = `
            <input type="text" class="dest-input" placeholder="Next Stop">
            <i class="fa-solid fa-trash remove-stop" onclick="this.parentElement.remove(); calcFare();"></i>
        `;
        // Insert before the last destination or just append
        container.appendChild(div);
        setupAutocomplete(div.querySelector('.dest-input'));
    }

    function calcFare() {
        const pickup = document.getElementById('pickup').value;
        const destInputs = document.querySelectorAll('.dest-input');
        const phone = document.getElementById('user-phone').value;
        
        const waypoints = [];
        let finalDest = "";

        destInputs.forEach((input, index) => {
            if (input.value) {
                if (index === destInputs.length - 1) finalDest = input.value;
                else waypoints.push({ location: input.value, stopover: true });
            }
        });

        if (!pickup || !finalDest || phone.length < 7) return;

        ds.route({
            origin: pickup,
            destination: finalDest,
            waypoints: waypoints,
            travelMode: 'DRIVING'
        }, (res, stat) => {
            if (stat === 'OK') {
                dr.setDirections(res);
                let totalMeters = 0;
                res.routes[0].legs.forEach(leg => totalMeters += leg.distance.value);
                
                const km = totalMeters / 1000;
                let base = 500, rate = 95;
                if (!phone.startsWith('876') && !phone.startsWith('1876')) { base = 850; rate = 185; }
                
                let total = Math.round((base + (km * rate)) / 10) * 10;
                document.getElementById('jmd-price').innerText = `$${total.toLocaleString()} JMD`;
                document.getElementById('usd-price').innerText = `≈ $${(total / EX_RATE).toFixed(2)} USD`;
                document.getElementById('price-box').style.display = 'block';
            }
        });
    }

    function initPayPal() {
        paypal.Buttons({
            createOrder: (data, actions) => {
                const amt = document.getElementById('usd-price').innerText.replace('≈ $', '').replace(' USD', '');
                return actions.order.create({ purchase_units: [{ amount: { value: amt } }] });
            }
        }).render('#paypal-button-container');
    }

    function sendWhatsApp() {
        const pickup = document.getElementById('pickup').value;
        const dests = Array.from(document.querySelectorAll('.dest-input')).map(i => i.value).join(' ➔ ');
        const msg = `*Cool Comfort Multi-Stop Booking*\n📍 Pickup: ${pickup}\n🗺️ Route: ${dests}\n💰 Est. Fare: ${document.getElementById('jmd-price').innerText}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }

    window.onload = initMap;
</script>
</body>
</html>
