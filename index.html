<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Premium Jamaica Pickup</title>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --teal: #008080; --navy: #002b36; --gold: #ffcc00; --white: #ffffff; --light-bg: #f4f7f7; --text-color: #002b36; --border-color: #ddd; }
        body { font-family: 'Times New Roman', Times, serif; margin: 0; background: var(--light-bg); color: var(--text-color); }
        header { background: linear-gradient(135deg, var(--navy), var(--teal)); color: white; padding: 2rem 1rem; text-align: center; border-bottom: 5px solid var(--gold); }
        .motto { font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; color: var(--gold); font-weight: bold; }

        .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
        .booking-card { margin: -20px auto 30px; background: var(--white); padding: 1.5rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid rgba(0,128,128,0.1); }

        .quick-selects { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; justify-content: center; }
        .quick-btn { background: var(--navy); color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; font-family: 'Times New Roman', serif; }

        .gps-btn { background: var(--teal); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 15px; font-weight: bold; font-family: 'Times New Roman', serif; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .input-group { margin-bottom: 12px; position: relative; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; box-sizing: border-box; background: var(--white); color: var(--text-color); font-family: 'Times New Roman', serif; }

        .pax-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .pax-row div { flex: 1; }

        .price-box { background: #f0fff4; padding: 15px; border-radius: 10px; margin-top: 15px; display: none; text-align: center; border: 2px dashed var(--teal); }
        #display-price-jmd { color: var(--teal); font-weight: bold; font-size: 1.3rem; margin-top: 5px; }
        
        .btn-book { background: var(--gold); color: var(--navy); padding: 1rem; border: none; font-weight: bold; width: 100%; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 1.1rem; font-family: 'Times New Roman', serif; margin-top: 10px; }

        .order-item { background: #fff; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 10px; position: relative; font-size: 0.9rem; }
        .btn-delete { position: absolute; right: 10px; top: 10px; color: #ff4444; border: none; background: none; font-size: 1.3rem; cursor: pointer; }

        #map { width: 100%; height: 200px; border-radius: 10px; margin: 15px 0; display: none; }
        footer { text-align: center; padding: 30px; font-size: 0.8rem; color: #777; }
    </style>
</head>
<body>

<header>
    <h1>COOL <span style="color:var(--gold)">COMFORT</span></h1>
    <div class="motto">PREMIUM • PUNCTUAL • PROFESSIONAL</div>
</header>

<div class="container">
    <div class="booking-card">
        <div class="quick-selects">
            <button class="quick-btn" onclick="setDest('MBJ Airport')">MBJ Airport</button>
            <button class="quick-btn" onclick="setDest('Ocho Rios Pier')">Ochi Pier</button>
            <button class="quick-btn" onclick="setDest('Negril 7-Mile Beach')">Negril</button>
        </div>

        <button class="gps-btn" onclick="getLocation()"><i class="fa fa-location-crosshairs"></i> USE MY CURRENT LOCATION</button>
        
        <div class="input-group"><input type="text" id="pickup" placeholder="Pickup point"></div>
        <div class="input-group"><input type="text" id="destination" placeholder="Destination"></div>
        
        <div style="display:flex; gap:10px; margin-bottom:12px;">
            <input type="date" id="book-date">
            <input type="time" id="book-time">
        </div>

        <div class="pax-row">
            <div>
                <select id="adults" onchange="calc()">
                    <option value="1">1 Adult</option><option value="2">2 Adults</option>
                    <option value="3">3 Adults</option><option value="4">4 Adults</option>
                </select>
            </div>
            <div>
                <select id="kids" onchange="calc()">
                    <option value="0">0 Kids</option><option value="1">1 Kid</option>
                    <option value="2">2 Kids</option>
                </select>
            </div>
        </div>

        <div id="map"></div>

        <div id="price-box" class="price-box">
            <small style="color:var(--teal); text-transform:uppercase; font-weight:bold;">Cost-Effective Quote</small>
            <h2 id="display-price-usd" style="margin:5px 0 0 0;">$0.00 USD</h2>
            <div id="display-price-jmd">≈ $0 JMD</div>
        </div>

        <button class="btn-book" onclick="book()"><i class="fab fa-whatsapp"></i> SEND BOOKING REQUEST</button>

        <div style="margin-top:20px; border-top: 1px solid var(--gold); padding-top:15px;">
            <h4 style="text-align:center; font-family: 'Times New Roman', serif; margin-bottom:10px;">Pending Logs</h4>
            <div id="order-list"></div>
        </div>
    </div>
</div>

<footer>&copy; 2026 Cool Comfort | Pierce Irons</footer>

<script>
    let map, ds, dr, geo, orders = [];
    const EX_RATE = 156;

    function init() {
        const opts = { componentRestrictions: { country: "jm" } };
        new google.maps.places.Autocomplete(document.getElementById('pickup'), opts).addListener('place_changed', calc);
        new google.maps.places.Autocomplete(document.getElementById('destination'), opts).addListener('place_changed', calc);
        ds = new google.maps.DirectionsService();
        geo = new google.maps.Geocoder();
        dr = new google.maps.DirectionsRenderer({ map: new google.maps.Map(document.getElementById('map'), { zoom: 8, center: { lat: 18.1, lng: -77.3 }, disableDefaultUI: true }) });
        document.getElementById('book-date').valueAsDate = new Date();
    }

    function setDest(val) { document.getElementById('destination').value = val; calc(); }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                geo.geocode({ location: { lat: pos.coords.latitude, lng: pos.coords.longitude } }, (res, stat) => {
                    if (stat === "OK") { document.getElementById('pickup').value = res[0].formatted_address; calc(); }
                });
            });
        }
    }

    function calc() {
        const p = document.getElementById('pickup').value, d = document.getElementById('destination').value;
        if (!p || !d) return;

        ds.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (res, stat) => {
            if (stat === 'OK') {
                dr.setDirections(res);
                document.getElementById('map').style.display = 'block';
                const km = res.routes[0].legs[0].distance.value / 1000;
                
                // COST-EFFECTIVE LOGIC: $10 Base + $0.70 per km (No group surcharge)
                const usd = 10 + (km * 0.70);
                const jmd = usd * EX_RATE;
                
                document.getElementById('display-price-usd').innerText = "$" + usd.toFixed(2) + " USD";
                document.getElementById('display-price-jmd').innerText = "≈ $" + Math.round(jmd).toLocaleString() + " JMD";
                document.getElementById('price-box').style.display = 'block';
            }
        });
    }

    function book() {
        const p = document.getElementById('pickup').value, d = document.getElementById('destination').value;
        const dt = document.getElementById('book-date').value, tm = document.getElementById('book-time').value;
        const usd = document.getElementById('display-price-usd').innerText;
        const jmd = document.getElementById('display-price-jmd').innerText;
        const ad = document.getElementById('adults').value, kd = document.getElementById('kids').value;
        
        if(!p || !d) return alert("Please select locations.");
        
        orders.push({ id: Date.now(), d, dt, tm, usd, jmd, ad, kd });
        renderOrders();

        const msg = `Booking for Cool Comfort:\n📅 ${dt} @ ${tm}\n📍 From: ${p}\n🏁 To: ${d}\n👥 Adults: ${ad}, Kids: ${kd}\n💰 Quote: ${usd} (${jmd})`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }

    function renderOrders() {
        const list = document.getElementById('order-list');
        list.innerHTML = orders.length ? '' : '<p style="text-align:center; opacity:0.5; font-size:0.75rem;">No recent logs.</p>';
        orders.forEach(o => {
            const item = document.createElement('div');
            item.className = 'order-item';
            item.innerHTML = `
                <button class="btn-delete" onclick="remove(${o.id})">&times;</button>
                <b>${o.dt} | ${o.tm}</b><br>
                To: ${o.d}<br>
                Quote: ${o.usd} / ${o.jmd}
            `;
            list.appendChild(item);
        });
    }

    function remove(id) { orders = orders.filter(o => o.id !== id); renderOrders(); }

    window.onload = init;
</script>
</body>
</html>
