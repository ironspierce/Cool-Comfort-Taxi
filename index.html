<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | The Gold Standard</title>
    
    <!-- Design Assets -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Intelligence APIs -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY_HERE&libraries=places"></script>
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --white: #ffffff; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: var(--white); 
            height: 100vh; overflow: hidden; /* App-like feel */
        }

        .hero { 
            height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
            background: linear-gradient(rgba(0,31,38,0.9), rgba(0,31,38,0.95)), url('Cover Photo.jpg');
            background-size: cover; background-position: center;
        }
        
        .booking-card { 
            width: 100%; max-width: 500px; background: var(--glass); backdrop-filter: blur(40px); 
            border-radius: 40px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); 
            position: relative; height: 650px; display: flex; flex-direction: column;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
        }

        /* Progress Intel */
        .progress-container { display: flex; justify-content: space-between; margin-bottom: 40px; position: relative; }
        .progress-bar { position: absolute; top: 50%; left: 0; height: 2px; background: rgba(255,255,255,0.1); width: 100%; z-index: 1; transform: translateY(-50%); }
        .progress-fill { position: absolute; top: 50%; left: 0; height: 2px; background: var(--gold); width: 0%; z-index: 2; transform: translateY(-50%); transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .step-dot { width: 12px; height: 12px; background: #333; border-radius: 50%; z-index: 3; transition: 0.4s; border: 2px solid var(--navy); }
        .step-dot.active { background: var(--gold); box-shadow: 0 0 15px var(--gold); transform: scale(1.2); }

        /* Step Animations */
        .step { display: none; animation: slideUp 0.5s ease-out forwards; flex-grow: 1; }
        .step.active { display: flex; flex-direction: column; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .section-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); margin-bottom: 25px; display: block; text-align: center; }

        /* Multi-choice Grid */
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); 
            padding: 20px; border-radius: 25px; cursor: pointer; text-align: center; transition: 0.3s;
        }
        .option-btn.active { border-color: var(--gold); background: rgba(212,175,55,0.15); transform: scale(1.02); }
        .option-btn i { font-size: 1.8rem; color: var(--gold); margin-bottom: 12px; display: block; }
        .option-btn b { display: block; font-size: 0.9rem; margin-bottom: 4px; }
        .option-btn small { font-size: 0.65rem; opacity: 0.6; }

        /* Objective Scroll */
        .scroll-list { overflow-y: auto; padding-right: 10px; margin-bottom: 10px; }
        .item-card { 
            background: rgba(255,255,255,0.03); border-radius: 20px; padding: 18px; 
            margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s;
        }
        .item-card.selected { border-left: 5px solid var(--gold); background: rgba(212,175,55,0.1); }
        .item-card b { display: block; font-size: 0.95rem; color: var(--gold); }
        .item-card p { font-size: 0.75rem; margin: 5px 0; line-height: 1.4; opacity: 0.8; }
        .item-card span { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; opacity: 0.5; }

        /* Location Tools */
        .geo-btn { 
            background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold);
            padding: 14px; border-radius: 15px; width: 100%; margin-bottom: 15px; cursor: pointer;
            font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .pulse { animation: p 2s infinite; }
        @keyframes p { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        #map { width: 100%; height: 160px; border-radius: 25px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        input { 
            width: 100%; padding: 18px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 15px; color: white; margin-bottom: 12px; font-family: inherit;
        }

        /* Nav Footer */
        .nav-buttons { margin-top: auto; display: flex; gap: 15px; }
        .btn-next { background: var(--gold); color: var(--navy); border: none; padding: 20px; border-radius: 20px; flex: 2; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        .btn-back { background: rgba(255,255,255,0.1); color: white; border: none; padding: 20px; border-radius: 20px; flex: 1; font-weight: 700; cursor: pointer; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    </style>
</head>
<body>

<section class="hero">
    <div class="booking-card">
        <!-- Progress System -->
        <div class="progress-container">
            <div class="progress-bar"></div>
            <div class="progress-fill" id="progress-fill"></div>
            <div class="step-dot active"></div>
            <div class="step-dot"></div>
            <div class="step-dot"></div>
            <div class="step-dot"></div>
        </div>

        <!-- STEP 1: DURATION -->
        <div class="step active" id="step-1">
            <span class="section-label">01. Mission Timeline</span>
            <div class="grid-options">
                <div class="option-btn active" onclick="setDays(1, this)"><b>1 Day</b><small>Local Escort</small></div>
                <div class="option-btn" onclick="setDays(3, this)"><b>3 Days</b><small>Short Tour</small></div>
                <div class="option-btn" onclick="setDays(7, this)"><b>7 Days</b><small>Island Wide</small></div>
                <div class="option-btn" onclick="setDays(14, this)"><b>14 Days</b><small>Full Experience</small></div>
            </div>
        </div>

        <!-- STEP 2: FLEET -->
        <div class="step" id="step-2">
            <span class="section-label">02. Fleet Selection</span>
            <div class="grid-options">
                <div class="option-btn active" onclick="setFleet('Executive Sedan', 155, this)"><i class="fa-solid fa-car"></i><b>Sedan</b></div>
                <div class="option-btn" onclick="setFleet('Premium SUV', 230, this)"><i class="fa-solid fa-suv"></i><b>SUV</b></div>
                <div class="option-btn" onclick="setFleet('Private Van', 350, this)"><i class="fa-solid fa-van-shuttle"></i><b>Van</b></div>
                <div class="option-btn" onclick="setFleet('VIP Coaster', 550, this)"><i class="fa-solid fa-bus"></i><b>VIP Bus</b></div>
            </div>
        </div>

        <!-- STEP 3: OBJECTIVES -->
        <div class="step" id="step-3">
            <span class="section-label">03. Curate Itinerary</span>
            <div class="scroll-list" id="poi-list">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- STEP 4: LOGISTICS -->
        <div class="step" id="step-4">
            <span class="section-label">04. Deployment Intel</span>
            <div id="map"></div>
            
            <button class="geo-btn" onclick="detectLocation()">
                <i class="fa-solid fa-location-crosshairs pulse"></i>
                <span id="geo-text">AUTO-DETECT PICKUP</span>
            </button>

            <input type="text" id="pickup" placeholder="Departure Location">
            <input type="text" id="destination" placeholder="Final Objective / Hotel">

            <div style="text-align: center; padding: 15px; background: rgba(212,175,55,0.1); border: 1px solid var(--gold); border-radius: 20px;">
                <div id="jmd-price" style="font-size: 1.8rem; font-weight: 700; color: var(--gold);">$0 JMD</div>
                <small id="usd-price" style="opacity: 0.6;">≈ $0.00 USD</small>
            </div>
        </div>

        <!-- Footer Navigation -->
        <div class="nav-buttons">
            <button class="btn-back" id="prevBtn" onclick="changeStep(-1)" style="display:none;">Back</button>
            <button class="btn-next" id="nextBtn" onclick="changeStep(1)">Continue</button>
        </div>
    </div>
</section>

<script>
    let currentStep = 0;
    let missionDays = 1, kmRate = 155, currentFleet = "Executive Sedan";
    let selectedPOIs = [];
    let map, ds, dr;

    const data = [
        { name: "S Hotel Jamaica", cat: "Stay", desc: "Vibrant luxury boutique overlooking Doctor's Cave." },
        { name: "Half Moon Resort", cat: "Stay", desc: "Legendary 400-acre estate in Montego Bay." },
        { name: "Scotchies Jerk", cat: "Foodie", desc: "Authentic pimento-wood smoked jerk chicken/pork." },
        { name: "Gloria's Seafood", cat: "Foodie", desc: "World-class seafood in historic Port Royal." },
        { name: "Dunn's River Falls", cat: "Nature", desc: "Climb the world-famous waterfalls in Ocho Rios." },
        { name: "Blue Hole", cat: "Nature", desc: "Exotic hidden lagoons and limestone jumps." },
        { name: "Rick's Cafe", cat: "Sunset", desc: "Epic cliff jumping and Negril's best sunset views." }
    ];

    function changeStep(n) {
        const steps = document.getElementsByClassName("step");
        steps[currentStep].classList.remove("active");
        currentStep += n;

        if (currentStep >= steps.length) {
            sendWhatsApp();
            currentStep = steps.length - 1;
        }

        steps[currentStep].classList.add("active");
        updateUI();
    }

    function updateUI() {
        const dots = document.getElementsByClassName("step-dot");
        const fill = document.getElementById("progress-fill");
        
        for (let i = 0; i < dots.length; i++) {
            dots[i].classList.toggle("active", i <= currentStep);
        }
        fill.style.width = (currentStep / (dots.length - 1)) * 100 + "%";

        document.getElementById("prevBtn").style.display = currentStep === 0 ? "none" : "block";
        document.getElementById("nextBtn").innerText = currentStep === dots.length - 1 ? "Confirm Deployment" : "Continue";

        if (currentStep === 2) loadPOIs();
        if (currentStep === 3) setTimeout(initMap, 100);
    }

    function loadPOIs() {
        const list = document.getElementById('poi-list');
        list.innerHTML = data.map(item => `
            <div class="item-card ${selectedPOIs.includes(item.name) ? 'selected' : ''}" onclick="togglePOI('${item.name}', this)">
                <span>${item.cat}</span>
                <b>${item.name}</b>
                <p>${item.desc}</p>
            </div>
        `).join('');
    }

    function togglePOI(name, el) {
        if (selectedPOIs.includes(name)) {
            selectedPOIs = selectedPOIs.filter(i => i !== name);
            el.classList.remove('selected');
        } else {
            selectedPOIs.push(name);
            el.classList.add('selected');
        }
    }

    function setDays(d, el) {
        missionDays = d;
        document.querySelectorAll('#step-1 .option-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function setFleet(name, rate, el) {
        currentFleet = name; kmRate = rate;
        document.querySelectorAll('#step-2 .option-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function initMap() {
        if (map) return;
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 10, center: { lat: 18.4762, lng: -77.8938 }, 
            mapTypeId: 'satellite', disableDefaultUI: true,
            styles: [{ featureType: "all", elementType: "labels", stylers: [{ visibility: "on" }] }]
        });
        ds = new google.maps.DirectionsService();
        dr = new google.maps.DirectionsRenderer({ map: map, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 5 } });
        
        setupAC(document.getElementById('pickup'));
        setupAC(document.getElementById('destination'));
    }

    function setupAC(input) {
        const ac = new google.maps.places.Autocomplete(input, { componentRestrictions: { country: "jm" } });
        ac.addListener('place_changed', calcFare);
    }

    function detectLocation() {
        const status = document.getElementById('geo-text');
        status.innerText = "SEARCHING...";
        navigator.geolocation.getCurrentPosition(pos => {
            const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            new google.maps.Geocoder().geocode({ location: latlng }, (res, stat) => {
                if (stat === "OK") {
                    document.getElementById('pickup').value = res[0].formatted_address;
                    status.innerText = "LOCATION SECURED";
                    map.setCenter(latlng);
                    map.setZoom(14);
                    calcFare();
                }
            });
        }, () => status.innerText = "ACCESS DENIED");
    }

    function calcFare() {
        const p = document.getElementById('pickup').value;
        const d = document.getElementById('destination').value;
        if (!p || !d) return;

        ds.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (res, stat) => {
            if (stat === "OK") {
                dr.setDirections(res);
                const km = res.routes[0].legs[0].distance.value / 1000;
                const total = Math.round(((1500 + (km * kmRate)) * missionDays) / 10) * 10;
                document.getElementById('jmd-price').innerText = `$${total.toLocaleString()} JMD`;
                document.getElementById('usd-price').innerText = `≈ $${(total / 156).toFixed(2)} USD`;
            }
        });
    }

    function sendWhatsApp() {
        const text = `*COOL COMFORT MISSION DEPLOYED*\n\n` +
                     `Fleet: ${currentFleet}\n` +
                     `Duration: ${missionDays} Days\n` +
                     `Objectives: ${selectedPOIs.join(', ') || 'None'}\n` +
                     `From: ${document.getElementById('pickup').value}\n` +
                     `To: ${document.getElementById('destination').value}\n` +
                     `Total: ${document.getElementById('jmd-price').innerText}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(text)}`);
    }
</script>
</body>
</html>
