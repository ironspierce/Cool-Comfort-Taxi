<!-- Add this CSS to your <style> -->
<style>
    .geo-btn {
        background: rgba(212, 175, 55, 0.1);
        border: 1px solid var(--gold);
        color: var(--gold);
        padding: 10px;
        border-radius: 12px;
        width: 100%;
        margin-bottom: 15px;
        cursor: pointer;
        font-size: 0.75rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: 0.3s;
    }
    .geo-btn:hover { background: var(--gold); color: var(--navy); }
    .pulse-icon { animation: geo-pulse 2s infinite; }
    @keyframes geo-pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    
    .loading-spinner { display: none; width: 15px; height: 15px; border: 2px solid var(--navy); border-top: 2px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>

<!-- Update STEP 4 HTML -->
<div class="step" id="step-4">
    <span class="section-label">Deployment Brief</span>
    <div id="map"></div>
    
    <!-- Auto Location Button -->
    <button class="geo-btn" onclick="detectLocation()">
        <i class="fa-solid fa-location-crosshairs pulse-icon"></i>
        <span id="geo-text">AUTO-DETECT PICKUP</span>
        <div class="loading-spinner" id="geo-loader"></div>
    </button>

    <input type="text" id="pickup" placeholder="Departure Point">
    <input type="text" id="destination" placeholder="Primary Objective">
    
    <div style="text-align: center; background: rgba(212,175,55,0.1); padding: 15px; border-radius: 15px; border: 1px solid var(--gold);">
        <div id="jmd-price" style="font-size: 1.8rem; font-weight: 700; color: var(--gold);">$0 JMD</div>
        <small id="usd-price">≈ $0.00 USD</small>
    </div>
</div>

<!-- Add this Logic to your <script> -->
<script>
    function detectLocation() {
        const btnText = document.getElementById('geo-text');
        const loader = document.getElementById('geo-loader');
        const pickupInput = document.getElementById('pickup');

        if (!navigator.geolocation) {
            alert("Geolocation is not supported by your browser");
            return;
        }

        btnText.innerText = "ACQUIRING INTEL...";
        loader.style.display = "block";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const latlng = { lat: parseFloat(lat), lng: parseFloat(lng) };
                const geocoder = new google.maps.Geocoder();

                geocoder.geocode({ location: latlng }, (results, status) => {
                    loader.style.display = "none";
                    if (status === "OK") {
                        if (results[0]) {
                            pickupInput.value = results[0].formatted_address;
                            btnText.innerText = "LOCATION LOCKED";
                            // Update map center
                            map.setCenter(latlng);
                            map.setZoom(15);
                            new google.maps.Marker({ position: latlng, map: map, icon: 'https://maps.google.com/mapfiles/ms/icons/gold-dot.png' });
                            calcFinal();
                        }
                    } else {
                        btnText.innerText = "RETRY DETECTION";
                        alert("Geocoder failed due to: " + status);
                    }
                });
            },
            () => {
                loader.style.display = "none";
                btnText.innerText = "DETECTION FAILED";
                alert("Please enable location permissions in your browser settings.");
            }
        );
    }
</script>
