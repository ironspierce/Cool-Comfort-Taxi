<div class="card">
    <h2><i class="fa fa-map-location-dot"></i> Trip Planner</h2>
    <p>Select your destination for instant rates and travel time.</p>
    
    <label>Select Your Route:</label>
    <select id="routeSelect" onchange="updateTripDetails()" style="width:100%; padding:12px; margin:15px 0; border-radius:5px; border:none; font-size:1.1em; background: white; color: var(--secondary-navy);">
        <option value="0|0|0">-- Select a Destination --</option>
        <option value="15|25|2500">MBJ Airport to Rose Hall Hotels</option>
        <option value="10|15|1500">MBJ Airport to Montego Bay Town</option>
        <option value="80|90|12000">MBJ Airport to Negril (7-Mile Beach)</option>
        <option value="105|110|15000">MBJ Airport to Ocho Rios (Dunn's River)</option>
        <option value="45|50|7500">Montego Bay to Falmouth (Cruise Port)</option>
        <option value="custom">Custom Distance...</option>
    </select>

    <div id="customInput" style="display:none;">
        <label>Enter Distance (km):</label>
        <input type="number" id="kmInput" placeholder="e.g. 5" min="1">
    </div>

    <button class="btn-calc" onclick="finalCalculate()">Show Trip Details</button>

    <div id="tripOutput" style="margin-top: 20px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; display:none;">
        <h3 id="fareResult" style="color: var(--accent-gold); margin: 0;"></h3>
        <p id="timeResult" style="margin: 5px 0 0 0; font-size: 0.9em;"></p>
        <p id="distResult" style="margin: 5px 0 0 0; font-size: 0.9em; color: #ccc;"></p>
    </div>
</div>

<script>
    function updateTripDetails() {
        const route = document.getElementById('routeSelect').value;
        const customDiv = document.getElementById('customInput');
        customDiv.style.display = (route === "custom") ? "block" : "none";
    }

    function finalCalculate() {
        const routeValue = document.getElementById('routeSelect').value;
        let km, mins, price;

        if (routeValue === "custom") {
            km = document.getElementById('kmInput').value;
            if (!km || km <= 0) { alert("Please enter distance"); return; }
            mins = Math.round(km * 1.5); // Average Jamaica traffic estimate
            price = 500 + (km * 150); // Base + per km
        } else if (routeValue === "0|0|0") {
            alert("Please select a route");
            return;
        } else {
            const data = routeValue.split('|');
            km = data[0];
            mins = data[1];
            price = data[2];
        }

        const usd = (price / 155).toFixed(2);
        
        document.getElementById('tripOutput').style.display = "block";
        document.getElementById('fareResult').innerHTML = "Price: $" + price + " JMD ($" + usd + " USD)";
        document.getElementById('timeResult').innerHTML = "<i class='fa fa-clock'></i> Est. Time: " + mins + " minutes";
        document.getElementById('distResult').innerHTML = "<i class='fa fa-road'></i> Distance: " + km + " km";
    }
</script>
