<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | The Gold Standard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Intelligence APIs -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY_HERE&libraries=places"></script>
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --white: #ffffff; --glass: rgba(255, 255, 255, 0.07); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: var(--white); 
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .hero { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,31,38,0.85), rgba(0,31,38,0.95)), url('Cover Photo.jpg');
            background-size: cover; background-position: center; z-index: -1;
        }
        
        .booking-card { 
            width: 92%; max-width: 480px; height: 85vh; max-height: 750px;
            background: var(--glass); backdrop-filter: blur(30px); 
            border-radius: 40px; border: 1px solid rgba(255,255,255,0.1); 
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
        }

        /* HEADER SECTION (Fixed) */
        .card-header { padding: 30px 30px 10px 30px; }
        .progress-container { display: flex; justify-content: space-between; margin-bottom: 25px; position: relative; }
        .progress-bar { position: absolute; top: 50%; left: 0; height: 2px; background: rgba(255,255,255,0.1); width: 100%; z-index: 1; transform: translateY(-50%); }
        .progress-fill { position: absolute; top: 50%; left: 0; height: 2px; background: var(--gold); width: 0%; z-index: 2; transform: translateY(-50%); transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .step-dot { width: 10px; height: 10px; background: #333; border-radius: 50%; z-index: 3; transition: 0.4s; border: 2px solid var(--navy); }
        .step-dot.active { background: var(--gold); box-shadow: 0 0 15px var(--gold); }

        /* SCROLLABLE CONTENT AREA */
        .card-content { 
            flex-grow: 1; overflow-y: auto; padding: 0 30px; 
            scrollbar-width: none; -ms-overflow-style: none; 
        }
        .card-content::-webkit-scrollbar { display: none; }

        .step { display: none; animation: slideUp 0.4s ease-out forwards; }
        .step.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .section-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); margin-bottom: 20px; display: block; text-align: center; }

        /* Options & Grids */
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .option-btn { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); 
            padding: 18px; border-radius: 20px; cursor: pointer; text-align: center; transition: 0.3s;
        }
        .option-btn.active { border-color: var(--gold); background: rgba(212,175,55,0.15); }
        .option-btn i { font-size: 1.5rem; color: var(--gold); margin-bottom: 10px; display: block; }
        .option-btn b { display: block; font-size: 0.85rem; }

        /* Multi-selection Cards */
        .item-card { 
            background: rgba(255,255,255,0.03); border-radius: 20px; padding: 18px; 
            margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer;
        }
        .item-card.selected { border-left: 4px solid var(--gold); background: rgba(212,175,55,0.1); }
        .item-card b { color: var(--gold); font-size: 0.9rem; }
        .item-card p { font-size: 0.7rem; margin: 5px 0; opacity: 0.7; line-height: 1.4; }

        /* Footer (Fixed) */
        .card-footer { padding: 20px 30px 30px 30px; display: flex; gap: 12px; background: transparent; }
        .btn-next { background: var(--gold); color: var(--navy); border: none; padding: 18px; border-radius: 18px; flex: 2; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .btn-back { background: rgba(255,255,255,0.1); color: white; border: none; padding: 18px; border-radius: 18px; flex: 1; font-weight: 700; cursor: pointer; }

        /* Inputs & Map */
        #map { width: 100%; height: 160px; border-radius: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        input { width: 100%; padding: 16px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; margin-bottom: 10px; font-family: inherit; }
        
        .geo-btn { 
            background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); color: var(--gold);
            padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 15px; cursor: pointer; font-size: 0.7rem; font-weight: 700;
        }
    </style>
</head>
<body>

<div class="hero"></div>

<div class="booking-card">
    <!-- Fixed Progress -->
    <div class="card-header">
        <div class="progress-container">
            <div class="progress-bar"></div>
            <div class="progress-fill" id="progress-fill"></div>
            <div class="step-dot active"></div>
            <div class="step-dot"></div>
            <div class="step-dot"></div>
            <div class="step-dot"></div>
        </div>
    </div>

    <!-- Scrollable Body -->
    <div class="card-content" id="card-content">
        
        <!-- STEP 1 -->
        <div class="step active">
            <span class="section-label">01. Choose Timeline</span>
            <div class="grid-options">
                <div class="option-btn active" onclick="setVal('days', 1, this)"><b>1 Day</b></div>
                <div class="option-btn" onclick="setVal('days', 3, this)"><b>3 Days</b></div>
                <div class="option-btn" onclick="setVal('days', 7, this)"><b>7 Days</b></div>
                <div class="option-btn" onclick="setVal('days', 14, this)"><b>14 Days</b></div>
            </div>
            <p style="text-align: center; font-size: 0.7rem; opacity: 0.5;">Select the total duration for your customized Jamaican mission.</p>
        </div>

        <!-- STEP 2 -->
        <div class="step">
            <span class="section-label">02. Select Vehicle</span>
            <div class="grid-options">
                <div class="option-btn active" onclick="setVal('fleet', 155, this, 'Sedan')"><i class="fa-solid fa-car"></i><b>Sedan</b></div>
                <div class="option-btn" onclick="setVal('fleet', 230, this, 'SUV')"><i class="fa-solid fa-suv"></i><b>SUV</b></div>
                <div class="option-btn" onclick="setVal('fleet', 350, this, 'Van')"><i class="fa-solid fa-van-shuttle"></i><b>Van</b></div>
                <div class="option-btn" onclick="setVal('fleet', 550, this, 'Bus')"><i class="fa-solid fa-bus"></i><b>Bus</b></div>
            </div>
        </div>

        <!-- STEP 3 -->
        <div class="step">
            <span class="section-label">03. Target Locations</span>
            <div id="poi-list">
                <!-- POIs with long descriptions that will trigger scrolling -->
            </div>
        </div>

        <!-- STEP 4 -->
        <div class="step">
            <span class="section-label">04. Final Intel</span>
            <div id="map"></div>
            <button class="geo-btn" onclick="detectLocation()">AUTO-DETECT PICKUP</button>
            <input type="text" id="pickup" placeholder="Departure Location">
            <input type="text" id="destination" placeholder="Final Hotel / Objective">
            
            <div style="text-align: center; padding: 20px; background: rgba(212,175,55,0.1); border: 1px solid var(--gold); border-radius: 20px;">
                <div id="jmd-price" style="font-size: 1.8rem; font-weight: 700; color: var(--gold);">$0 JMD</div>
                <small id="usd-price" style="opacity: 0.6;">≈ $0.00 USD</small>
            </div>
        </div>

    </div>

    <!-- Fixed Footer -->
    <div class="card-footer">
        <button class="btn-back" id="prevBtn" onclick="move(-1)" style="display:none;">Back</button>
        <button class="btn-next" id="nextBtn" onclick="move(1)">Continue</button>
    </div>
</div>

<script>
    let step = 0;
    let days = 1, rate = 155, fleet = "Sedan", pois = [];
    const poiData = [
        { name: "S Hotel Jamaica", desc: "Luxury boutique overlooking the iconic Doctor's Cave beach. A haven of style." },
        { name: "Half Moon", desc: "Elegance defined. A 400-acre estate featuring private villas and world-class golf." },
        { name: "Scotchies Jerk", desc: "The gold standard for jerk chicken and pork, smoked over authentic pimento wood." },
        { name: "Rick's Cafe", desc: "Legendary cliff jumping and the most spectacular sunset vibes in Negril." },
        { name: "Dunn's River", desc: "Climb the world-famous natural terraced waterfalls in the heart of Ocho Rios." },
        { name: "Frenchman's Cove", desc: "Where a crystal clear river meets the turquoise sea in a secluded paradise." }
    ];

    function move(n) {
        const steps = document.getElementsByClassName("step");
        steps[step].classList.remove("active");
        step += n;

        if (step >= steps.length) {
            sendWhatsApp();
            step = steps.length - 1;
        }

        steps[step].classList.add("active");
        document.getElementById('card-content').scrollTop = 0; // Reset scroll on next step
        update();
    }

    function update() {
        const dots = document.getElementsByClassName("step-dot");
        document.getElementById("progress-fill").style.width = (step / (dots.length - 1)) * 100 + "%";
        for (let i = 0; i < dots.length; i++) dots[i].classList.toggle("active", i <= step);
        
        document.getElementById("prevBtn").style.display = step === 0 ? "none" : "block";
        document.getElementById("nextBtn").innerText = step === 3 ? "Launch Mission" : "Continue";

        if (step === 2) loadPOIs();
        if (step === 3) initMap();
    }

    function setVal(type, val, el, name) {
        if (type === 'days') days = val;
        if (type === 'fleet') { rate = val; fleet = name; }
        el.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function loadPOIs() {
        document.getElementById('poi-list').innerHTML = poiData.map(item => `
            <div class="item-card ${pois.includes(item.name) ? 'selected' : ''}" onclick="togglePOI('${item.name}', this)">
                <b>${item.name}</b>
                <p>${item.desc}</p>
            </div>
        `).join('');
    }

    function togglePOI(n, el) {
        if (pois.includes(n)) { pois = pois.filter(i => i !== n); el.classList.remove('selected'); }
        else { pois.push(n); el.classList.add('selected'); }
    }

    function sendWhatsApp() {
        const msg = `*COOL COMFORT MISSION*\nDuration: ${days} Days\nFleet: ${fleet}\nObjectives: ${pois.join(', ') || 'Custom'}\nTotal: ${document.getElementById('jmd-price').innerText}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }

    // Standard Map & Calc logic goes here (same as previous)
    function initMap() { /* ... */ }
</script>
</body>
</html>
