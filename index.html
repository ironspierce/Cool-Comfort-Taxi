<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Premium Jamaica Pickup</title>
    <meta name="theme-color" content="#002b36">
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --teal: #008080; --navy: #002b36; --gold: #ffcc00; --white: #ffffff; --light-bg: #f4f7f7; --text-color: #002b36; --border-color: #ddd; }
        body { font-family: 'Times New Roman', Times, serif; margin: 0; background: var(--light-bg); color: var(--text-color); }
        header { background: linear-gradient(135deg, var(--navy), var(--teal)); color: white; padding: 2rem 1rem; text-align: center; border-bottom: 5px solid var(--gold); }
        .motto { font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; color: var(--gold); font-weight: bold; }
        .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
        .booking-card { margin: -20px auto 30px; background: var(--white); padding: 1.5rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid rgba(0,128,128,0.1); }
        .gps-btn { background: var(--teal); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 15px; font-weight: bold; font-family: 'Times New Roman', serif; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .input-group { margin-bottom: 12px; position: relative; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; box-sizing: border-box; background: var(--white); color: var(--text-color); font-family: 'Times New Roman', serif; }
        .rt-toggle { background: var(--light-bg); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid var(--border-color); cursor: pointer; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--teal); }
        input:checked + .slider:before { transform: translateX(20px); }
        .price-box { background: #f0fff4; padding: 20px; border-radius: 10px; margin-top: 15px; display: none; text-align: center; border: 2px dashed var(--teal); }
        .bid-input { font-size: 1.8rem; font-weight: bold; color: var(--teal); border: 2px solid var(--teal); border-radius: 8px; width: 80%; text-align: center; margin: 10px 0; background: white; }
        .btn-book { background: var(--gold); color: var(--navy); padding: 1.2rem; border: none; font-weight: bold; width: 100%; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 1.1rem; font-family: 'Times New Roman', serif; margin-top: 15px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-book:disabled { background: #ccc; cursor: not-allowed; }
        #map { width: 100%; height: 250px; border-radius: 10px; margin: 15px 0; display: none; border: 1px solid var(--border-color); }
        footer { text-align: center; padding: 30px; font-size: 0.8rem; color: #777; border-top: 1px solid var(--border-color); margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <h1>COOL <span style="color:var(--gold)">COMFORT</span></h1>
    <div class="motto">PREMIER • PUNCTUAL • PROFESSIONAL</div>
</header>

<div class="container">
    <div class="booking-card">
        <button class="gps-btn" onclick="getLocation()"><i class="fa fa-location-crosshairs"></i> USE MY CURRENT LOCATION</button>
        <div class="input-group"><input type="text" id="pickup" placeholder="Pickup point (Address or Lot #)"></div>
        <div class="input-group"><input type="text" id="destination" placeholder="Destination"></div>
        <div style="display:flex; gap:10px; margin-bottom:12px;"><input type="date" id="book-date"><input type="time" id="book-time"></div>
        <div class="rt-toggle" onclick="toggleRT()">
            <span style="font-size: 0.85rem; font-weight: bold;"><i class="fa fa-arrows-rotate"></i> Add Round Trip (10% Off)</span>
            <label class="switch"><input type="checkbox" id="roundtrip" onchange="calc()"><span class="slider"></span></label>
        </div>
        <div id="map"></div>
        <div id="price-box" class="price-box">
            <span style="font-size: 0.75rem; font-weight: bold; color: var(--teal);">SUGGESTED JMD FARE</span><br>
            <input type="number" id="user-bid" class="bid-input" oninput="updateUSD()">
            <div id="usd-equivalent" style="opacity:0.6; font-size:0.9rem;">≈ $0.00 USD</div>
            <div style="margin-top:15px; text-align:left;">
                <label style="font-size: 0.8rem; font-weight: bold;">Passengers:</label>
                <select id="pax-count"><option value="1">1 Person</option><option value="2">2 People</option><option value="3">3 People</option><option value="4">4 People</option></select>
            </div>
        </div>
        <button id="book-btn" class="btn-book" onclick="book()"><i class="fab fa-whatsapp"></i> REQUEST PICKUP</button>
    </div>
</div>

<footer>© 2026 Cool Comfort Jamaica | Pierce Irons</footer>

<script>
    let ds, dr, geo, pickupAc, destAc;
    const EX_RATE = 156;

    function init() {
        const opts = { 
            componentRestrictions: { country: "jm" },
            fields: ["formatted_address", "geometry"] 
        };
        
        pickupAc = new google.maps.places.Autocomplete(document.getElementById('pickup'), opts);
        destAc = new google.maps.places.Autocomplete(document.getElementById('destination'), opts);
        
        pickupAc.addListener('place_changed', calc);
        destAc.addListener('place_changed', calc);
        
        ds = new google.maps.DirectionsService();
        geo = new google.maps.Geocoder();
        
        const mapEl = document.getElementById('map');
        const mapInstance = new google.maps.Map(mapEl, { 
            zoom: 12, 
            center: { lat: 17.9175, lng: -77.1328 }, // Centered near Old Harbour/Kingston area
            disableDefaultUI: true 
        });
        
        dr = new google.maps.DirectionsRenderer({ 
            map: mapInstance,
            panel: null,
            suppressMarkers: false
        });
        
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById('book-date').value = `${year}-${month}-${day}`;
        document.getElementById('book-time').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    function calc() {
        const p = document.getElementById('pickup').value;
        const d = document.getElementById('destination').value;
        if (!p || !d) return;

        ds.route({ 
            origin: p, 
            destination: d, 
            travelMode: 'DRIVING',
            provideRouteAlternatives: false
        }, (res, stat) => {
            if (stat === 'OK') {
                dr.setDirections(res);
                document.getElementById('map').style.display = 'block';
                
                const km = res.routes[0].legs[0].distance.value / 1000;
                
                // RIDE-SHARE COMPETITIVE LOCAL LOGIC
                let base = 400, rate = 90;
                
                // TOURIST PREMIUM LOGIC
                const pLower = p.toLowerCase();
                const dLower = d.toLowerCase();
                const touristZones = ['airport', 'hotel', 'resort', 'villa', 'inn', 'sandals', 'bahia', 'riu', 'hilton', 'hyatt', 'grand palladium', 'cruise', 'baha'];
                if (touristZones.some(k => pLower.includes(k) || dLower.includes(k))) { 
                    base = 1500; 
                    rate = 180; 
                }

                let total = base + (km * rate);
                if (document.getElementById('roundtrip').checked) total = (total * 2) * 0.90;
                if (total < 500 && base < 1000) total = 500;

                document.getElementById('user-bid').value = Math.round(total);
                updateUSD();
                document.getElementById('price-box').style.display = 'block';
            }
        });
    }

    function updateUSD() {
        const bid = document.getElementById('user-bid').value;
        document.getElementById('usd-equivalent').innerText = `≈ $${(bid / EX_RATE).toFixed(2)} USD`;
    }

    function formatAMPM(time) {
        let [h, m] = time.split(':');
        h = parseInt(h);
        return `${h % 12 || 12}:${m} ${h >= 12 ? 'PM' : 'AM'}`;
    }

    function book() {
        const p = document.getElementById('pickup').value;
        const d = document.getElementById('destination').value;
        const dt = document.getElementById('book-date').value;
        const tm = document.getElementById('book-time').value;
        if(!p || !d || !dt || !tm) return alert("Fill all details.");

        const inputs = document.querySelectorAll('input, select, button');
        inputs.forEach(i => i.disabled = true);
        document.getElementById('book-btn').innerHTML = '<i class="fa fa-spinner fa-spin"></i> SENDING...';

        const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(p)}&destination=${encodeURIComponent(d)}`;
        const msg = `*Cool Comfort Request* 🚕\n\n📅 *Date:* ${dt}\n⏰ *Time:* ${formatAMPM(tm)}\n📍 *From:* ${p}\n🏁 *To:* ${d}\n👥 *Pax:* ${document.getElementById('pax-count').value}\n🔄 *RT:* ${document.getElementById('roundtrip').checked ? "YES" : "NO"}\n💰 *Offer:* $${document.getElementById('user-bid').value} JMD\n\n🗺️ *Route:* ${mapsUrl}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }

    function toggleRT() { const cb = document.getElementById('roundtrip'); if(!cb.disabled) { cb.checked = !cb.checked; calc(); } }
    
    function getLocation() { 
        if (navigator.geolocation) { 
            navigator.geolocation.getCurrentPosition(pos => { 
                geo.geocode({ location: { lat: pos.coords.latitude, lng: pos.coords.longitude } }, (res, stat) => { 
                    if (stat === "OK") { 
                        document.getElementById('pickup').value = res[0].formatted_address; 
                        calc(); 
                    } 
                }); 
            }); 
        } 
    }
    
    window.onload = init;
</script>
</body>
</html>
