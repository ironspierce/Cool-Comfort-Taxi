<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Precision Fixed</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --glass: rgba(255, 255, 255, 0.06); --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: var(--white); overflow-x: hidden; }

        .hero { min-height: 100vh; background: linear-gradient(rgba(0,31,38,0.8), rgba(0,31,38,0.95)), url('Cover Photo.jpg'); background-size: cover; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        
        .portal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; width: 100%; max-width: 800px; }
        .service-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 35px; cursor: pointer; text-align: center; transition: 0.3s; }
        .service-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .service-card i { font-size: 2.5rem; color: var(--gold); margin-bottom: 15px; display: block; }

        .booking-ui { display: none; background: var(--glass); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.15); padding: 30px; border-radius: 40px; width: 100%; max-width: 550px; box-shadow: 0 40px 80px rgba(0,0,0,0.6); }
        .active-ui { display: block; animation: fadeIn 0.5s ease; }

        #map-v { width: 100%; height: 200px; border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); background: #000; }
        input, select { width: 100%; padding: 16px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; color: white; margin-bottom: 12px; font-family: inherit; }

        .premium-btn { background: var(--gold); color: var(--navy); border: none; padding: 20px; border-radius: 18px; width: 100%; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 2px; }
        .back-nav { color: var(--gold); cursor: pointer; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; display: inline-block; }

        .catalog { max-height: 300px; overflow-y: auto; margin-bottom: 20px; }
        .catalog-item { background: rgba(255,255,255,0.03); border-radius: 15px; margin-bottom: 10px; display: flex; align-items: center; cursor: pointer; border: 1px solid transparent; }
        .catalog-item.active { border-color: var(--gold); background: rgba(212,175,55,0.1); }
        .item-thumb { width: 80px; height: 80px; background-size: cover; border-radius: 15px 0 0 15px; }
        .item-meta { padding: 10px 15px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .pac-container { z-index: 10000 !important; background: #001f26; border: 1px solid var(--gold); border-radius: 10px; color: #fff; }
    </style>
</head>
<body>

<section class="hero">
    <div id="portal" class="portal-grid">
        <div class="service-card" onclick="startBooking('taxi')"><i class="fa-solid fa-bolt"></i><h2>Instant Taxi</h2><p>Immediate Pickup</p></div>
        <div class="service-card" onclick="startBooking('tour')"><i class="fa-solid fa-crown"></i><h2>Appointment</h2><p>Luxury Tours</p></div>
    </div>

    <div class="booking-ui" id="ui">
        <span class="back-nav" onclick="window.location.reload()"><i class="fa-solid fa-arrow-left"></i> Back</span>
        
        <div id="tour-step" style="display:none;">
            <div class="catalog" id="cat-list"></div>
            <button class="premium-btn" style="margin-bottom:20px" onclick="toLogistics()">Set Schedule</button>
        </div>

        <div id="log-step">
            <div id="map-v"></div>
            <input type="text" id="p-in" placeholder="Pickup Address">
            <input type="text" id="d-in" placeholder="Destination">
            
            <div id="fare-display" style="text-align:center; padding:15px; background:rgba(212,175,55,0.1); border-radius:15px; border:1px solid var(--gold); margin-bottom:15px; display:none;">
                <div id="jmd-price" style="font-size:1.8rem; font-weight:700; color:var(--gold);">$0 JMD</div>
                <div id="usd-price" style="font-size:0.8rem; opacity:0.6;">$0.00 USD</div>
            </div>

            <button class="premium-btn" onclick="bookNow()">Confirm Reservation</button>
        </div>
    </div>
</section>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places,geometry&callback=initReady" async defer></script>
<script src="https://www.paypal.com/sdk/js?client-id=BAA8P6X3C7B5W&currency=USD"></script>

<script>
    let map, ds, dr, geo, isReady = false, mode = '', userPos = "";
    let basePrice = 600, selected = [];

    const tourData = [
        { n: "Doctor's Cave Beach", p: 4000, img: "https://images.unsplash.com/photo-1545532555-90141f021235?auto=format&w=200" },
        { n: "Dunn's River Falls", p: 9500, img: "https://images.unsplash.com/photo-1596328546171-77e37b5e8b3d?auto=format&w=200" }
    ];

    // CRITICAL: This fires only after Google is loaded
    function initReady() { isReady = true; }

    function startBooking(m) {
        mode = m;
        document.getElementById('portal').style.display = 'none';
        document.getElementById('ui').classList.add('active-ui');
        if(m === 'tour') {
            document.getElementById('tour-step').style.display = 'block';
            document.getElementById('log-step').style.display = 'none';
            renderCat();
        } else {
            initMapSystem();
        }
    }

    function renderCat() {
        document.getElementById('cat-list').innerHTML = tourData.map(t => `
            <div class="catalog-item" id="t-${t.n.replace(/\s/g,'')}" onclick="toggleT('${t.n}', ${t.p})">
                <div class="item-thumb" style="background-image:url('${t.img}')"></div>
                <div class="item-meta"><b>${t.n}</b></div>
            </div>`).join('');
    }

    function toggleT(n, p) {
        const el = document.getElementById('t-'+n.replace(/\s/g,''));
        if(selected.includes(n)) {
            selected = selected.filter(x => x !== n); basePrice -= p; el.classList.remove('active');
        } else {
            selected.push(n); basePrice += p; el.classList.add('active');
        }
    }

    function toLogistics() {
        document.getElementById('tour-step').style.display = 'none';
        document.getElementById('log-step').style.display = 'block';
        initMapSystem();
    }

    function initMapSystem() {
        if (!isReady) { setTimeout(initMapSystem, 500); return; }
        try {
            ds = new google.maps.DirectionsService();
            geo = new google.maps.Geocoder();
            map = new google.maps.Map(document.getElementById("map-v"), {
                zoom: 14, center: { lat: 18.47, lng: -77.89 }, mapTypeId: 'hybrid', disableDefaultUI: true
            });
            dr = new google.maps.DirectionsRenderer({ map: map, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 5 } });
            
            const acP = new google.maps.places.Autocomplete(document.getElementById('p-in'), { componentRestrictions: { country: "jm" } });
            const acD = new google.maps.places.Autocomplete(document.getElementById('d-in'), { componentRestrictions: { country: "jm" } });
            
            acP.addListener('place_changed', calculateFare);
            acD.addListener('place_changed', calculateFare);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => {
                    const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
                    userPos = `${pos.lat},${pos.lng}`;
                    map.setCenter(pos);
                    geo.geocode({ location: pos }, (res, stat) => {
                        if (stat === "OK" && res[0]) document.getElementById('p-in').value = res[0].formatted_address;
                    });
                }, null, { enableHighAccuracy: true });
            }
        } catch (e) { console.error("Map Error: ", e); }
    }

    function calculateFare() {
        const p = document.getElementById('p-in').value, d = document.getElementById('d-in').value;
        if (!p || !d) return;
        ds.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (res, stat) => {
            if (stat === "OK") {
                dr.setDirections(res);
                const km = res.routes[0].legs[0].distance.value / 1000;
                const total = Math.round((basePrice + (km * 155)) / 10) * 10;
                document.getElementById('jmd-price').innerText = `$${total.toLocaleString()} JMD`;
                document.getElementById('usd-price').innerText = `$${(total / 156).toFixed(2)} USD`;
                document.getElementById('fare-display').style.display = 'block';
            }
        });
    }

    function bookNow() {
        const gps = userPos ? `https://www.google.com/maps?q=${userPos}` : "Manual Entry";
        const msg = `*RESERVATION*\nMode: ${mode.toUpperCase()}\nPickup: ${document.getElementById('p-in').value}\nDest: ${document.getElementById('d-in').value}\nGPS: ${gps}\nStops: ${selected.join(', ') || 'Direct'}\nFare: ${document.getElementById('jmd-price').innerText}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }
</script>
</body>
</html>
