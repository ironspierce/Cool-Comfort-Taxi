<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | The Gold Standard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- API Integration -->
    <script src="https://www.paypal.com/sdk/js?client-id=BAA8P6X3C7B5W&merchant-id=26SBN3BDG55FQ&currency=USD"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places"></script>
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --glass: rgba(255, 255, 255, 0.08); --white: #ffffff; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: var(--white); line-height: 1.6; overflow-x: hidden; scroll-behavior: smooth; }

        .hero { position: relative; min-height: 100vh; width: 100%; background: linear-gradient(rgba(0,31,38,0.7), rgba(0,31,38,0.9)), url('Cover Photo.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 40px 20px; }
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.2rem); margin: 0; letter-spacing: 4px; color: var(--gold); text-align: center; text-transform: uppercase; }
        .motto { text-transform: uppercase; letter-spacing: 4px; font-size: 0.8rem; margin: 10px 0 20px 0; font-weight: 400; color: var(--white); opacity: 0.9; text-align: center; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); padding: 5px 15px; }

        .booking-card { background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); padding: 25px; border-radius: 30px; width: 100%; max-width: 550px; box-shadow: 0 40px 80px rgba(0,0,0,0.6); }
        
        /* Mission Status */
        .status-bar { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; color: #4caf50; }
        .status-dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; box-shadow: 0 0 10px #4caf50; animation: pulse 2s infinite; }

        /* Fleet Selector */
        .fleet-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .car-option { border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 12px; cursor: pointer; transition: 0.3s; text-align: center; background: rgba(255,255,255,0.03); }
        .car-option.active { border-color: var(--gold); background: rgba(212, 175, 55, 0.15); transform: scale(1.05); }
        .car-option i { font-size: 1.4rem; color: var(--gold); display: block; margin-bottom: 6px; }
        .car-option span { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        /* Itinerary Intelligence */
        .pref-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .pref-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 10px; color: white; cursor: pointer; font-size: 0.6rem; text-align: center; transition: 0.2s; }
        .pref-btn:hover { border-color: var(--gold); }
        .pref-btn i { display: block; font-size: 1rem; margin-bottom: 4px; color: var(--gold); }
        
        .poi-list { display: none; background: rgba(0,0,0,0.3); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--gold); }
        .poi-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.75rem; }
        .add-poi { color: var(--gold); cursor: pointer; font-weight: 700; text-transform: uppercase; font-size: 0.65rem; }

        #map { width: 100%; height: 250px; border-radius: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .input-group { margin-bottom: 10px; }
        input, select { width: 100%; padding: 14px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: white; font-family: 'Montserrat', sans-serif; font-size: 0.9rem; }

        .price-box { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 20px; margin: 15px 0; border: 1px solid var(--gold); text-align: center; display: none; border-left-width: 6px; }
        .btn-book { background: var(--gold); color: var(--navy); padding: 20px; border: none; width: 100%; border-radius: 16px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 12px; letter-spacing: 2px; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<section class="hero">
    <h1>Cool Comfort</h1>
    <div class="motto">The Gold Standard of Jamaican Transit</div>
    
    <div class="booking-card">
        <div class="status-bar"><div class="status-dot"></div> Mission Ready: Montego Bay Base</div>

        <div class="fleet-selector">
            <div class="car-option active" onclick="setFleet('Executive Sedan', 155, this)">
                <i class="fa-solid fa-car-side"></i><span>Sedan</span>
            </div>
            <div class="car-option" onclick="setFleet('Premium SUV', 230, this)">
                <i class="fa-solid fa-suv"></i><span>SUV</span>
            </div>
            <div class="car-option" onclick="setFleet('Private Van', 350, this)">
                <i class="fa-solid fa-van-shuttle"></i><span>Van</span>
            </div>
        </div>

        <div class="pref-grid">
            <div class="pref-btn" onclick="showPOIs('nature')"><i class="fa-solid fa-leaf"></i>Nature</div>
            <div class="pref-btn" onclick="showPOIs('history')"><i class="fa-solid fa-landmark"></i>History</div>
            <div class="pref-btn" onclick="showPOIs('foodie')"><i class="fa-solid fa-utensils"></i>Foodie</div>
            <div class="pref-btn" onclick="showPOIs('shopping')"><i class="fa-solid fa-bag-shopping"></i>Shop</div>
        </div>

        <div id="poi-container" class="poi-list"></div>

        <div id="map"></div>
        
        <div class="input-group">
            <input type="text" id="pickup" placeholder="Departure Point">
        </div>
        <div class="input-group">
            <input type="text" id="destination" placeholder="Primary Objective / Destination">
        </div>

        <div class="input-group">
            <select id="payment-method" onchange="updateUI()">
                <option value="cash">Payment: Cash in Hand</option>
                <option value="paypal">Payment: PayPal / Digital</option>
            </select>
        </div>

        <div id="price-box" class="price-box">
            <div id="jmd-price" style="font-size: 2.2rem; font-weight: 700; color: var(--gold);">$0 JMD</div>
            <div id="usd-price" style="opacity:0.8; display: none;">≈ $0.00 USD</div>
            <div id="paypal-button-container" style="display: none; margin-top: 15px;"></div>
        </div>

        <button class="btn-book" onclick="sendWhatsApp()"><i class="fab fa-whatsapp"></i> Initiate Mission</button>
    </div>
</section>

<script>
    let map, ds, dr;
    let kmRate = 155;
    let currentFleet = "Executive Sedan";
    const EX_RATE = 156;

    const poiData = {
        nature: [{ name: "Blue Hole", loc: "Blue Hole, Ocho Rios" }, { name: "YS Falls", loc: "YS Falls, St. Elizabeth" }],
        history: [{ name: "Rose Hall Great House", loc: "Rose Hall Great House" }, { name: "Bob Marley Museum", loc: "Bob Marley Museum, Kingston" }],
        foodie: [{ name: "Scotchies Jerk Center", loc: "Scotchies, Montego Bay" }, { name: "Rick's Cafe", loc: "Rick's Cafe, Negril" }],
        shopping: [{ name: "Main Street Jamaica", loc: "Main Street Jamaica" }, { name: "Whitter Village", loc: "Whitter Village, Montego Bay" }]
    };

    function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 12, center: { lat: 18.4762, lng: -77.8938 }, mapTypeId: 'satellite'
        });
        ds = new google.maps.DirectionsService();
        dr = new google.maps.DirectionsRenderer({ map: map, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 6 } });
        setupAutocomplete(document.getElementById('pickup'));
        setupAutocomplete(document.getElementById('destination'));
        initPayPal();
    }

    function setupAutocomplete(input) {
        const ac = new google.maps.places.Autocomplete(input, { componentRestrictions: { country: "jm" } });
        ac.addListener('place_changed', calcFare);
    }

    function showPOIs(cat) {
        const container = document.getElementById('poi-container');
        container.style.display = 'block';
        let html = `<div style="font-size:0.6rem; color:var(--gold); margin-bottom:10px; font-weight:700;">SELECT OBJECTIVE:</div>`;
        poiData[cat].forEach(poi => {
            html += `<div class="poi-item"><span>${poi.name}</span><span class="add-poi" onclick="addToItinerary('${poi.loc}')">+ Add</span></div>`;
        });
        container.innerHTML = html;
    }

    function addToItinerary(loc) {
        document.getElementById('destination').value = loc;
        calcFare();
        document.getElementById('poi-container').style.display = 'none';
    }

    function setFleet(name, rate, el) {
        kmRate = rate;
        currentFleet = name;
        document.querySelectorAll('.car-option').forEach(opt => opt.classList.remove('active'));
        el.classList.add('active');
        calcFare();
    }

    function calcFare() {
        const pickup = document.getElementById('pickup').value;
        const dest = document.getElementById('destination').value;
        if (!pickup || !dest) return;
        ds.route({ origin: pickup, destination: dest, travelMode: 'DRIVING' }, (res, stat) => {
            if (stat === 'OK') {
                dr.setDirections(res);
                const km = res.routes[0].legs[0].distance.value / 1000;
                const total = Math.round((1000 + (km * kmRate)) / 10) * 10;
                document.getElementById('jmd-price').innerText = `$${total.toLocaleString()} JMD`;
                document.getElementById('usd-price').innerText = `≈ $${(total / EX_RATE).toFixed(2)} USD`;
                document.getElementById('price-box').style.display = 'block';
                updateUI();
            }
        });
    }

    function updateUI() {
        const isPaypal = document.getElementById('payment-method').value === 'paypal';
        document.getElementById('paypal-button-container').style.display = isPaypal ? 'block' : 'none';
        document.getElementById('usd-price').style.display = isPaypal ? 'block' : 'none';
    }

    function initPayPal() {
        paypal.Buttons({
            createOrder: (data, actions) => {
                const amt = document.getElementById('usd-price').innerText.replace('≈ $', '').replace(' USD', '');
                return actions.order.create({ purchase_units: [{ amount: { value: amt } }] });
            }
        }).render('#paypal-button-container');
    }

    function sendWhatsApp() {
        const method = document.getElementById('payment-method').value.toUpperCase();
        const msg = `*COOL COMFORT MISSION*\n------------------\n🛸 FLEET: ${currentFleet}\n📍 FROM: ${document.getElementById('pickup').value}\n🏁 TO: ${document.getElementById('destination').value}\n💰 FARE: ${document.getElementById('jmd-price').innerText}\n💳 PAY: ${method}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }

    window.onload = initMap;
</script>
</body>
</html>
