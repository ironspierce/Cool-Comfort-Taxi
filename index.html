<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Sequential Leg Logistics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --glass: rgba(255, 255, 255, 0.08); }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: #fff; }

        .hero { min-height: 100vh; background: linear-gradient(rgba(0,31,38,0.9), rgba(0,31,38,0.95)), url('Cover Photo.jpg'); background-size: cover; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        
        .card { background: var(--glass); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); padding: 35px; border-radius: 45px; width: 100%; max-width: 600px; box-shadow: 0 50px 100px rgba(0,0,0,0.7); }
        
        h1 { font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; margin: 0 0 25px 0; letter-spacing: 3px; text-transform: uppercase; }

        #map-v { width: 100%; height: 220px; border-radius: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }

        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input { flex: 1; padding: 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; color: #fff; font-family: inherit; font-size: 0.85rem; }
        .remove-btn { background: rgba(255, 68, 68, 0.2); color: #ff4444; border: 1px solid #ff4444; border-radius: 12px; width: 40px; cursor: pointer; }
        
        .add-btn { background: none; color: var(--gold); border: 1px dashed var(--gold); padding: 10px; border-radius: 12px; width: 100%; cursor: pointer; margin-bottom: 20px; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; }

        .itinerary-summary { background: rgba(0,0,0,0.3); border-radius: 20px; padding: 15px; margin-bottom: 20px; display: none; font-size: 0.75rem; border-left: 4px solid var(--gold); }
        .leg-item { display: flex; justify-content: space-between; margin-bottom: 5px; opacity: 0.8; }

        .price-panel { background: var(--gold); color: var(--navy); border-radius: 25px; padding: 20px; text-align: center; margin-bottom: 20px; display: none; }
        .price-panel b { font-size: 2rem; display: block; }
        .price-panel span { font-size: 0.8rem; font-weight: 700; opacity: 0.8; }

        .book-btn { background: #fff; color: var(--navy); padding: 20px; border: none; border-radius: 15px; width: 100%; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 2px; }
    </style>
</head>
<body>

<section class="hero">
    <div class="card">
        <h1>Cool Comfort</h1>
        <div id="map-v"></div>

        <div id="route-box">
            <input type="text" id="start" placeholder="Pickup Location">
            <div id="stops-list" style="margin-top: 10px;"></div>
            <button class="add-btn" onclick="addNewStop()">+ Add Next Stop</button>
            <input type="text" id="end" placeholder="Final Destination">
        </div>

        <div id="itinerary" class="itinerary-summary">
            <div style="font-weight: 700; color: var(--gold); margin-bottom: 10px; text-transform: uppercase;">Route Analysis</div>
            <div id="legs-ui"></div>
        </div>

        <div class="price-panel" id="price-box">
            <span>Total Comprehensive Fare</span>
            <b id="jmd-total">$0 JMD</b>
            <div id="usd-total" style="font-weight:700; font-size: 0.9rem;">$0.00 USD</div>
        </div>

        <button class="book-btn" onclick="sendToWhatsApp()">Request Executive Transit</button>
    </div>
</section>

<script>
    let map, ds, dr, geo;
    const RATE = 155;
    const BASE = 600;

    function initMap() {
        ds = new google.maps.DirectionsService();
        geo = new google.maps.Geocoder();
        map = new google.maps.Map(document.getElementById("map-v"), {
            zoom: 12, center: { lat: 18.47, lng: -77.89 }, mapTypeId: 'hybrid', disableDefaultUI: true
        });
        dr = new google.maps.DirectionsRenderer({ map, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 5 } });

        setupAC(document.getElementById('start'));
        setupAC(document.getElementById('end'));
    }

    function setupAC(el) {
        const ac = new google.maps.places.Autocomplete(el, { componentRestrictions: { country: "jm" } });
        ac.addListener('place_changed', calculateChain);
    }

    function addNewStop() {
        const div = document.createElement('div');
        div.className = 'input-row';
        const id = 's-' + Date.now();
        div.id = id;
        div.innerHTML = `<input type="text" placeholder="Next Stop" class="waypoint"><button class="remove-btn" onclick="removeStop('${id}')">×</button>`;
        document.getElementById('stops-list').appendChild(div);
        setupAC(div.querySelector('input'));
    }

    function removeStop(id) {
        document.getElementById(id).remove();
        calculateChain();
    }

    function calculateChain() {
        const origin = document.getElementById('start').value;
        const destination = document.getElementById('end').value;
        if (!origin || !destination) return;

        const wps = Array.from(document.querySelectorAll('.waypoint')).map(i => ({ location: i.value, stopover: true }));

        ds.route({
            origin, destination, waypoints: wps, travelMode: 'DRIVING', optimizeWaypoints: false
        }, (res, stat) => {
            if (stat === "OK") {
                dr.setDirections(res);
                const legs = res.routes[0].legs;
                let totalKM = 0;
                let html = "";

                legs.forEach((leg, i) => {
                    const legKM = leg.distance.value / 1000;
                    totalKM += legKM;
                    html += `<div class="leg-item"><span>Leg ${i+1}:</span> <b>${legKM.toFixed(1)} km</b></div>`;
                });

                const totalJMD = Math.round((BASE + (totalKM * RATE)) / 10) * 10;
                
                document.getElementById('legs-ui').innerHTML = html;
                document.getElementById('itinerary').style.display = 'block';
                document.getElementById('jmd-total').innerText = `$${totalJMD.toLocaleString()} JMD`;
                document.getElementById('usd-total').innerText = `$${(totalJMD / 156).toFixed(2)} USD`;
                document.getElementById('price-box').style.display = 'block';
            }
        });
    }

    function sendToWhatsApp() {
        const jmd = document.getElementById('jmd-total').innerText;
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        const stops = Array.from(document.querySelectorAll('.waypoint')).map(i => i.value).join(' -> ');
        
        const msg = `*COOL COMFORT EXECUTIVE CHAIN*\n--------------------------\n📍 START: ${start}\n🛑 STOPS: ${stops || 'None'}\n🏁 END: ${end}\n💰 FARE: ${jmd}\n🛰️ LOGIC: Leg-by-Leg Calculation`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }

    window.onload = initMap;
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places&callback=initMap" async defer></script>
</body>
</html>
