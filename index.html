<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | The Gold Standard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.paypal.com/sdk/js?client-id=BAA8P6X3C7B5W&merchant-id=26SBN3BDG55FQ&currency=USD"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places,geometry"></script>
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --glass: rgba(255, 255, 255, 0.08); --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: var(--white); overflow-x: hidden; }

        .hero { min-height: 100vh; background: linear-gradient(rgba(0,31,38,0.85), rgba(0,31,38,0.95)), url('Cover Photo.jpg'); background-size: cover; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 40px 20px; }
        
        /* Entrance Portal */
        #portal { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 450px; text-align: center; }
        .portal-btn { background: var(--glass); border: 1px solid var(--gold); padding: 30px; border-radius: 30px; cursor: pointer; transition: 0.3s; backdrop-filter: blur(20px); }
        .portal-btn:hover { background: rgba(212,175,55,0.15); transform: translateY(-5px); }
        .portal-btn i { font-size: 2rem; color: var(--gold); margin-bottom: 10px; display: block; }
        .portal-btn h2 { margin: 0; font-family: 'Playfair Display', serif; color: var(--gold); }

        /* Booking Cards */
        .booking-card { display: none; background: var(--glass); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 40px; width: 100%; max-width: 550px; box-shadow: 0 50px 100px rgba(0,0,0,0.7); }
        .active-card { display: block; animation: slideUp 0.5s ease; }

        #map-instant, #map-charter { width: 100%; height: 180px; border-radius: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        input, select { width: 100%; padding: 16px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; color: white; margin-bottom: 15px; font-family: inherit; font-size: 0.9rem; }
        
        .btn-main { background: var(--gold); color: var(--navy); border: none; padding: 20px; border-radius: 18px; width: 100%; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 2px; }
        .btn-back { background: none; border: none; color: var(--gold); cursor: pointer; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; }

        .price-panel { text-align: center; padding: 20px; background: rgba(0,0,0,0.4); border: 1px solid var(--gold); border-radius: 20px; margin-bottom: 15px; }
        .paypal-container { display: none; margin-top: 15px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 20px; }

        .listing-scroll { max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 20px; padding: 10px; margin-bottom: 20px; }
        .list-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-radius: 10px; font-size: 0.8rem; }
        .list-item.active { border-left: 4px solid var(--gold); background: rgba(212,175,55,0.1); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<section class="hero">
    <div id="portal">
        <h1 style="font-family:'Playfair Display'; color:var(--gold); margin:0;">COOL COMFORT</h1>
        <p style="letter-spacing:4px; font-size:0.6rem; margin-bottom:30px;">EXECUTIVE TRANSIT SOLUTIONS</p>
        <div class="portal-btn" onclick="openService('instant')"><i class="fa-solid fa-bolt"></i><h2>Instant Taxi</h2><p>Pickup Now</p></div>
        <div class="portal-btn" onclick="openService('charter')"><i class="fa-solid fa-calendar-days"></i><h2>Appointment</h2><p>Charter & Tours</p></div>
    </div>

    <div id="instant-card" class="booking-card">
        <button class="btn-back" onclick="resetPortal()"><i class="fa-solid fa-chevron-left"></i> Menu</button>
        <div id="map-instant"></div>
        <input type="text" id="ins-pickup" placeholder="Current Location">
        <input type="text" id="ins-dest" placeholder="Where to?">
        
        <select id="ins-pay-method" onchange="togglePay('ins')">
            <option value="cash">Payment: Cash on Destination</option>
            <option value="paypal">Payment: PayPal / Digital Card</option>
        </select>

        <div class="price-panel" id="ins-price-box" style="display:none;">
            <div id="ins-jmd" style="font-size:1.8rem; font-weight:700; color:var(--gold);">$0 JMD</div>
            <div id="ins-usd" style="font-size:0.8rem; opacity:0.6;">≈ $0.00 USD</div>
            <div class="paypal-container" id="ins-paypal-box"></div>
        </div>
        
        <button class="btn-main" onclick="sendInstant()">Request Ride</button>
    </div>

    <div id="charter-card" class="booking-card">
        <button class="btn-back" onclick="resetPortal()"><i class="fa-solid fa-chevron-left"></i> Menu</button>
        
        <div id="cha-step-1">
            <span style="font-size:0.6rem; color:var(--gold); display:block; text-align:center; margin-bottom:15px; letter-spacing:2px;">SELECT STOP-OVERS</span>
            <div class="listing-scroll">
                <div class="list-item" onclick="tagPOI('Dunn\'s River Falls', 8500, this)"><b>Dunn's River</b><span>$8,500</span></div>
                <div class="list-item" onclick="tagPOI('Negril 7-Mile', 12000, this)"><b>Negril</b><span>$12,000</span></div>
                <div class="list-item" onclick="tagPOI('Rick\'s Cafe', 11000, this)"><b>Rick's Cafe</b><span>$11,000</span></div>
                <div class="list-item" onclick="tagPOI('Luminous Lagoon', 5500, this)"><b>Falmouth</b><span>$5,500</span></div>
            </div>
            <button class="btn-main" onclick="nextCha()">Continue</button>
        </div>

        <div id="cha-step-2" style="display:none;">
            <div id="map-charter"></div>
            <input type="text" id="cha-pickup" placeholder="Pickup Point">
            <input type="date" id="cha-date">
            
            <select id="cha-pay-method" onchange="togglePay('cha')">
                <option value="cash">Payment: Cash on Destination</option>
                <option value="paypal">Payment: PayPal / Digital Card</option>
            </select>

            <div class="price-panel">
                <div id="cha-jmd" style="font-size:1.8rem; font-weight:700; color:var(--gold);">$0 JMD</div>
                <div id="cha-usd" style="font-size:0.8rem; opacity:0.6;">≈ $0.00 USD</div>
                <div class="paypal-container" id="cha-paypal-box"></div>
            </div>
            <button class="btn-main" onclick="sendCharter()">Confirm Appointment</button>
        </div>
    </div>
</section>

<script>
    let mapIns, mapCha, ds, drIns, drCha, geocoder;
    let charTotal = 600, currentInsPrice = 0, selectedPois = [];

    function openService(t) {
        document.getElementById('portal').style.display = 'none';
        document.getElementById(t + '-card').classList.add('active-card');
        init();
    }

    function resetPortal() { location.reload(); }

    function init() {
        ds = new google.maps.DirectionsService();
        geocoder = new google.maps.Geocoder();
        mapIns = new google.maps.Map(document.getElementById("map-instant"), { zoom: 15, center: { lat: 18.47, lng: -77.89 }, mapTypeId: 'hybrid', disableDefaultUI: true });
        drIns = new google.maps.DirectionsRenderer({ map: mapIns, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 5 } });
        mapCha = new google.maps.Map(document.getElementById("map-charter"), { zoom: 10, center: { lat: 18.2, lng: -77.3 }, mapTypeId: 'hybrid', disableDefaultUI: true });
        drCha = new google.maps.DirectionsRenderer({ map: mapCha, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 5 } });
        setupAC(document.getElementById('ins-pickup'), 'ins');
        setupAC(document.getElementById('ins-dest'), 'ins');
        setupAC(document.getElementById('cha-pickup'), 'cha');
        locate();
    }

    function setupAC(input, type) {
        const ac = new google.maps.places.Autocomplete(input, { componentRestrictions: { country: "jm" } });
        ac.addListener('place_changed', () => type === 'ins' ? calcIns() : null);
    }

    function locate() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
                mapIns.setCenter(pos);
                geocoder.geocode({ location: pos }, (res, stat) => {
                    if (stat === "OK" && res[0]) document.getElementById('ins-pickup').value = res[0].formatted_address;
                });
            }, null, { enableHighAccuracy: true });
        }
    }

    function calcIns() {
        const p = document.getElementById('ins-pickup').value, d = document.getElementById('ins-dest').value;
        if (!p || !d) return;
        ds.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (res, stat) => {
            if (stat === "OK") {
                drIns.setDirections(res);
                const km = res.routes[0].legs[0].distance.value / 1000;
                currentInsPrice = Math.round((600 + (km * 155)) / 10) * 10;
                document.getElementById('ins-jmd').innerText = `$${currentInsPrice.toLocaleString()} JMD`;
                document.getElementById('ins-usd').innerText = `≈ $${(currentInsPrice / 156).toFixed(2)} USD`;
                document.getElementById('ins-price-box').style.display = 'block';
                renderPP('ins', (currentInsPrice / 156).toFixed(2));
            }
        });
    }

    function tagPOI(n, p, el) {
        if (selectedPois.includes(n)) {
            selectedPois = selectedPois.filter(i => i !== n);
            charTotal -= p; el.classList.remove('active');
        } else {
            selectedPois.push(n);
            charTotal += p; el.classList.add('active');
        }
        document.getElementById('cha-jmd').innerText = `$${charTotal.toLocaleString()} JMD`;
        document.getElementById('cha-usd').innerText = `≈ $${(charTotal / 156).toFixed(2)} USD`;
        renderPP('cha', (charTotal / 156).toFixed(2));
    }

    function nextCha() {
        document.getElementById('cha-step-1').style.display = 'none';
        document.getElementById('cha-step-2').style.display = 'block';
        google.maps.event.trigger(mapCha, 'resize');
    }

    function togglePay(t) {
        const method = document.getElementById(t + '-pay-method').value;
        document.getElementById(t + '-paypal-box').style.display = (method === 'paypal') ? 'block' : 'none';
    }

    function renderPP(containerId, amount) {
        const box = document.getElementById(containerId + '-paypal-box');
        box.innerHTML = '';
        paypal.Buttons({
            createOrder: (data, actions) => actions.order.create({ purchase_units: [{ amount: { value: amount } }] })
        }).render('#' + containerId + '-paypal-box');
    }

    function sendInstant() {
        const msg = `*INSTANT REQUEST*\nPickup: ${document.getElementById('ins-pickup').value}\nDest: ${document.getElementById('ins-dest').value}\nFare: ${document.getElementById('ins-jmd').innerText}\nPayment: ${document.getElementById('ins-pay-method').value.toUpperCase()}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }

    function sendCharter() {
        const msg = `*CHARTER REQUEST*\nDate: ${document.getElementById('cha-date').value}\nDestinations: ${selectedPois.join(', ')}\nTotal: ${document.getElementById('cha-jmd').innerText}\nPayment: ${document.getElementById('cha-pay-method').value.toUpperCase()}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }
</script>
</body>
</html>
