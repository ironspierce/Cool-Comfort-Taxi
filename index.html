<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Premium Jamaica Pickup</title>
    
    <meta name="theme-color" content="#002b36">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Cool%20Comfort%22,%22short_name%22:%22CoolComfort%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23002b36%22,%22theme_color%22:%22%23002b36%22}">
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --teal: #008080; --navy: #002b36; --gold: #ffcc00; --white: #ffffff; --light-bg: #f4f7f7; --text-color: #002b36; --border-color: #ddd; }
        body.dark { --teal: #4db6ac; --navy: #0e3b43; --white: #212121; --light-bg: #121212; --text-color: #e0e0e0; --border-color: #444; }

        body { font-family: 'Times New Roman', Times, serif; margin: 0; background: var(--light-bg); color: var(--text-color); transition: background 0.3s; }
        header { background: linear-gradient(135deg, var(--navy), var(--teal)); color: white; padding: 2rem 1rem; text-align: center; border-bottom: 5px solid var(--gold); }
        .motto { font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; color: var(--gold); font-weight: bold; }

        .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
        .booking-card { margin: -20px auto 30px; background: var(--white); padding: 1.5rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid rgba(0,128,128,0.1); }

        .input-group { margin-bottom: 12px; position: relative; }
        .input-group i { position: absolute; left: 12px; top: 12px; color: var(--teal); }
        input, select { width: 100%; padding: 10px 10px 10px 35px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; box-sizing: border-box; background: var(--white); color: var(--text-color); font-family: 'Times New Roman', serif; }

        .btn-book { background: var(--gold); color: var(--navy); padding: 1rem; border: none; font-weight: bold; width: 100%; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 1.1rem; font-family: 'Times New Roman', serif; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }

        /* Pending Section Styles */
        .pending-section { margin-top: 30px; padding-top: 20px; border-top: 2px solid var(--gold); text-align: center; }
        .btn-add-manual { background: var(--navy); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-family: 'Times New Roman', serif; font-size: 0.9rem; margin-bottom: 15px; display: inline-flex; align-items: center; gap: 8px; }
        
        .manual-form { display: none; background: var(--light-bg); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); text-align: left; }
        
        .order-item { background: #fff; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 10px; position: relative; text-align: left; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); }
        .order-item.dark-card { background: #2a2a2a; color: #fff; }
        .btn-delete { position: absolute; right: 10px; top: 10px; color: #ff4444; border: none; background: none; font-size: 1.3rem; cursor: pointer; }

        #map { width: 100%; height: 200px; border-radius: 10px; margin: 15px 0; display: none; }
        footer { text-align: center; padding: 30px; font-size: 0.8rem; color: #777; }
    </style>
</head>
<body>

<header>
    <h1>COOL <span style="color:var(--gold)">COMFORT</span></h1>
    <div class="motto">PREMIUM • PUNCTUAL • PROFESSIONAL</div>
</header>

<div class="container">
    <div class="booking-card">
        <div class="input-group"><i class="fa fa-map-pin"></i><input type="text" id="pickup" placeholder="Pickup"></div>
        <div class="input-group"><i class="fa fa-flag-checkered"></i><input type="text" id="destination" placeholder="Destination"></div>
        
        <div style="display:flex; gap:10px; margin-bottom:12px;">
            <input type="date" id="book-date">
            <input type="time" id="book-time">
        </div>

        <div id="map"></div>
        <button class="btn-book" onclick="book()"><i class="fab fa-whatsapp"></i> BOOK WITH PIERCE</button>

        <div class="pending-section">
            <h3 style="font-family: 'Times New Roman', serif;">Pending Orders</h3>
            
            <button class="btn-add-manual" onclick="toggleManualForm()">
                <i class="fa fa-plus-circle"></i> ADD CUSTOM ORDER
            </button>

            <div id="manual-form" class="manual-form">
                <input type="text" id="m-loc" placeholder="Location/Note" style="margin-bottom:8px; padding-left:10px;">
                <div style="display:flex; gap:5px;">
                    <input type="date" id="m-date" style="padding-left:10px;">
                    <input type="time" id="m-time" style="padding-left:10px;">
                </div>
                <button class="btn-book" style="margin-top:10px; font-size:0.9rem; padding:8px;" onclick="saveManual()">SAVE TO LIST</button>
            </div>

            <div id="order-list"></div>
        </div>
    </div>
</div>

<footer>&copy; 2026 Cool Comfort | Pierce Irons</footer>

<script>
    let map, ds, dr, orders = [];

    function init() {
        const opts = { componentRestrictions: { country: "jm" } };
        new google.maps.places.Autocomplete(document.getElementById('pickup'), opts);
        new google.maps.places.Autocomplete(document.getElementById('destination'), opts);
        ds = new google.maps.DirectionsService();
        dr = new google.maps.DirectionsRenderer({ map: new google.maps.Map(document.getElementById('map'), { zoom: 8, center: { lat: 18.1, lng: -77.3 } }) });
        document.getElementById('book-date').valueAsDate = new Date();
    }

    function toggleManualForm() {
        const f = document.getElementById('manual-form');
        f.style.display = (f.style.display === 'block') ? 'none' : 'block';
    }

    function saveManual() {
        const loc = document.getElementById('m-loc').value;
        const date = document.getElementById('m-date').value;
        const time = document.getElementById('m-time').value;
        
        if(!loc || !date || !time) return alert("Fill all fields");
        
        addOrder(loc, date, time, "Manual Entry");
        document.getElementById('manual-form').style.display = 'none';
        document.getElementById('m-loc').value = '';
    }

    function book() {
        const p = document.getElementById('pickup').value, d = document.getElementById('destination').value;
        const date = document.getElementById('book-date').value, time = document.getElementById('book-time').value;
        
        if(!p || !d || !date || !time) return alert("Fill all fields");
        
        addOrder(d, date, time, "WhatsApp Lead");
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent("Booking: " + d + " on " + date + " at " + time)}`);
    }

    function addOrder(loc, date, time, type) {
        orders.push({ id: Date.now(), loc, date, time, type });
        renderOrders();
    }

    function renderOrders() {
        const list = document.getElementById('order-list');
        list.innerHTML = orders.length ? '' : '<p style="opacity:0.5; font-size:0.8rem;">No active orders.</p>';
        orders.forEach(o => {
            const item = document.createElement('div');
            item.className = 'order-item';
            item.innerHTML = `
                <button class="btn-delete" onclick="remove(${o.id})">&times;</button>
                <small style="color:var(--teal)">${o.type}</small><br>
                <b>Date:</b> ${o.date} | <b>Time:</b> ${o.time}<br>
                <b>Loc:</b> ${o.loc}
            `;
            list.appendChild(item);
        });
    }

    function remove(id) { orders = orders.filter(o => o.id !== id); renderOrders(); }

    window.onload = init;
</script>
</body>
</html>
