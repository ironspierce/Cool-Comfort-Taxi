<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Premier Route Logistics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --glass: rgba(255, 255, 255, 0.08); }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: #fff; overflow-x: hidden; }

        .hero { min-height: 100vh; background: linear-gradient(rgba(0,31,38,0.85), rgba(0,31,38,0.95)), url('Cover Photo.jpg'); background-size: cover; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 40px 20px; }
        
        .card { background: var(--glass); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); padding: 35px; border-radius: 45px; width: 100%; max-width: 600px; box-shadow: 0 50px 100px rgba(0,0,0,0.7); }
        
        h1 { font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; margin: 0 0 30px 0; letter-spacing: 4px; text-transform: uppercase; }

        #map-v { width: 100%; height: 250px; border-radius: 30px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }

        /* Multi-Stop UI */
        .stop-container { margin-bottom: 15px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; position: relative; }
        input { flex: 1; padding: 18px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; color: #fff; font-family: inherit; font-size: 0.9rem; }
        .remove-btn { background: #ff4444; color: white; border: none; border-radius: 12px; width: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .add-stop-btn { background: rgba(255,255,255,0.05); color: var(--gold); border: 1px dashed var(--gold); padding: 12px; border-radius: 15px; width: 100%; cursor: pointer; margin-bottom: 20px; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; }

        /* Pricing Panel */
        .price-panel { background: rgba(0,0,0,0.5); border: 1px solid var(--gold); border-radius: 25px; padding: 25px; text-align: center; margin-bottom: 25px; display: none; }
        .price-row { display: flex; justify-content: space-between; font-size: 0.75rem; opacity: 0.6; margin-bottom: 10px; padding: 0 10px; }
        .grand-total { font-size: 2.2rem; font-weight: 700; color: var(--gold); margin: 10px 0; }
        .usd-val { font-size: 1rem; opacity: 0.8; letter-spacing: 1px; }

        .book-btn { background: var(--gold); color: var(--navy); padding: 22px; border: none; border-radius: 20px; width: 100%; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 3px; font-size: 1rem; }

        .pac-container { z-index: 10000 !important; background: #001f26; border: 1px solid var(--gold); color: #fff; border-radius: 10px; }
    </style>
</head>
<body>

<section class="hero">
    <div class="card">
        <h1>Cool Comfort</h1>
        
        <div id="map-v"></div>

        <div id="route-manager">
            <span style="font-size: 0.6rem; color: var(--gold); letter-spacing: 3px; text-transform: uppercase; display: block; text-align: center; margin-bottom: 15px;">Route Architecture</span>
            
            <div class="input-row">
                <input type="text" id="pickup" placeholder="Pickup Point (A)">
            </div>

            <div id="stops-list" class="stop-container">
                </div>

            <button class="add-stop-btn" onclick="addStop()">+ Add Intermediate Stop</button>

            <div class="input-row">
                <input type="text" id="destination" placeholder="Final Destination (B)">
            </div>
        </div>

        <div class="price-panel" id="price-box">
            <div class="price-row"><span>Route Distance:</span><span id="dist-ui">0 km</span></div>
            <div class="grand-total" id="jmd-price">$0 JMD</div>
            <div class="usd-val" id="usd-price">$0.00 USD</div>
            <div style="font-size: 0.6rem; margin-top: 10px; opacity: 0.5;">Includes $600 Base Executive Fee</div>
        </div>

        <button class="book-btn" onclick="requestDispatch()">Confirm Itinerary</button>
    </div>
</section>

<script>
    let map, ds, dr, geo, stops = [];
    const EX_RATE = 156;

    function initMap() {
        ds = new google.maps.DirectionsService();
        geo = new google.maps.Geocoder();
        map = new google.maps.Map(document.getElementById("map-v"), {
            zoom: 12, center: { lat: 18.47, lng: -77.89 }, mapTypeId: 'hybrid', disableDefaultUI: true
        });
        dr = new google.maps.DirectionsRenderer({ map, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 6 } });

        setupAC(document.getElementById('pickup'));
        setupAC(document.getElementById('destination'));
        
        // Auto-locate pickup
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
                map.setCenter(pos);
                geo.geocode({ location: pos }, (res, stat) => {
                    if (stat === "OK" && res[0]) document.getElementById('pickup').value = res[0].formatted_address;
                });
            });
        }
    }

    function setupAC(input) {
        const ac = new google.maps.places.Autocomplete(input, { componentRestrictions: { country: "jm" } });
        ac.addListener('place_changed', calculateRoute);
    }

    function addStop() {
        const container = document.getElementById('stops-list');
        const id = 'stop-' + Date.now();
        const row = document.createElement('div');
        row.className = 'input-row';
        row.id = id;
        row.innerHTML = `
            <input type="text" placeholder="Additional Stop" class="waypoint">
            <button class="remove-btn" onclick="removeStop('${id}')"><i class="fa-solid fa-trash"></i></button>
        `;
        container.appendChild(row);
        setupAC(row.querySelector('input'));
    }

    function removeStop(id) {
        document.getElementById(id).remove();
        calculateRoute();
    }

    function calculateRoute() {
        const start = document.getElementById('pickup').value;
        const end = document.getElementById('destination').value;
        if (!start || !end) return;

        const waypointInputs = document.querySelectorAll('.waypoint');
        const waypoints = [];
        waypointInputs.forEach(input => {
            if (input.value) waypoints.push({ location: input.value, stopover: true });
        });

        ds.route({
            origin: start,
            destination: end,
            waypoints: waypoints,
            travelMode: 'DRIVING',
            optimizeWaypoints: false // Keep user order
        }, (res, stat) => {
            if (stat === "OK") {
                dr.setDirections(res);
                let totalMeters = 0;
                res.routes[0].legs.forEach(leg => totalMeters += leg.distance.value);
                
                const km = totalMeters / 1000;
                const totalJMD = Math.round((600 + (km * 155)) / 10) * 10;
                
                document.getElementById('dist-ui').innerText = km.toFixed(1) + " km";
                document.getElementById('jmd-price').innerText = `$${totalJMD.toLocaleString()} JMD`;
                document.getElementById('usd-price').innerText = `$${(totalJMD / EX_RATE).toFixed(2)} USD`;
                document.getElementById('price-box').style.display = 'block';
            }
        });
    }

    function requestDispatch() {
        const start = document.getElementById('pickup').value;
        const end = document.getElementById('destination').value;
        const wps = Array.from(document.querySelectorAll('.waypoint')).map(i => i.value).filter(v => v);
        const price = document.getElementById('jmd-price').innerText;
        
        const msg = `*COOL COMFORT MULTI-STOP BOOKING*\n--------------------------\n📍 START: ${start}\n🛑 STOPS: ${wps.join(' -> ') || 'Direct'}\n🏁 FINAL: ${end}\n💰 TOTAL: ${price}\n🛰️ PATH: Logic Calculated`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }

    window.onload = initMap;
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places&callback=initMap" async defer></script>

</body>
</html>
