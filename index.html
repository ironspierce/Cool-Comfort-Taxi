<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Scheduled Executive Logistics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --glass: rgba(255, 255, 255, 0.08); }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: #fff; }

        .hero { min-height: 100vh; background: radial-gradient(circle, #003a47 0%, #001f26 100%); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        
        .card { background: var(--glass); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); padding: 35px; border-radius: 45px; width: 100%; max-width: 550px; box-shadow: 0 50px 100px rgba(0,0,0,0.7); }
        
        h1 { font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; margin-bottom: 25px; letter-spacing: 3px; text-transform: uppercase; }

        #map-v { width: 100%; height: 220px; border-radius: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }

        .status-pill { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.6rem; text-transform: uppercase; margin-bottom: 15px; font-weight: 700; background: rgba(255,255,255,0.1); color: var(--gold); }
        .detecting { animation: pulse 1.5s infinite; }

        .section-label { font-size: 0.6rem; color: var(--gold); letter-spacing: 3px; text-transform: uppercase; display: block; text-align: center; margin: 15px 0 10px 0; }

        input { width: 100%; padding: 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; color: #fff; font-family: inherit; font-size: 0.85rem; margin-bottom: 10px; box-sizing: border-box; }
        
        /* Calendar/Clock Icon Color Fixes for Modern Browsers */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(75%) sepia(50%) saturate(400%) hue-rotate(5deg);
            cursor: pointer;
        }

        .datetime-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .datetime-row input { margin-bottom: 0; }

        .add-btn { background: none; color: var(--gold); border: 1px dashed var(--gold); padding: 10px; border-radius: 12px; width: 100%; cursor: pointer; margin-bottom: 20px; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; }

        .price-panel { background: var(--gold); color: var(--navy); border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 20px; display: none; }
        .price-panel b { font-size: 1.8rem; display: block; }

        .book-btn { background: #fff; color: var(--navy); padding: 20px; border: none; border-radius: 15px; width: 100%; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 2px; }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .pac-container { z-index: 10000 !important; }
    </style>
</head>
<body>

<section class="hero">
    <div class="card">
        <h1>Cool Comfort</h1>
        <div style="text-align: center;"><span id="geo-status" class="status-pill detecting">Initializing GPS...</span></div>
        <div id="map-v"></div>

        <!-- Route Section -->
        <span class="section-label">Route Architecture</span>
        <div id="route-manager">
            <input type="text" id="start" placeholder="Pickup Address (Detecting...)">
            <div id="stops-list"></div>
            <button class="add-btn" onclick="addNewStop()">+ Add Next Leg</button>
            <input type="text" id="end" placeholder="Final Destination">
        </div>

        <!-- NEW: Schedule Section -->
        <span class="section-label">Schedule Dimensions</span>
        <div class="datetime-row">
            <input type="date" id="pickup-date" required>
            <input type="time" id="pickup-time" required>
        </div>

        <div class="price-panel" id="price-box">
            <b id="jmd-total">$0 JMD</b>
            <span id="usd-total" style="font-weight:700; font-size: 0.8rem;">$0.00 USD</span>
        </div>

        <button class="book-btn" onclick="sendToWhatsApp()">Confirm Reservation</button>
    </div>
</section>

<script>
    let map, ds, dr, geo;
    const RATE = 155;
    const BASE = 600;

    function initMap() {
        ds = new google.maps.DirectionsService();
        geo = new google.maps.Geocoder();
        map = new google.maps.Map(document.getElementById("map-v"), {
            zoom: 14, center: { lat: 18.47, lng: -77.89 }, mapTypeId: 'hybrid', disableDefaultUI: true
        });
        dr = new google.maps.DirectionsRenderer({ map, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 5 } });

        setupAC(document.getElementById('start'));
        setupAC(document.getElementById('end'));
        
        // Default the date input to today's date automatically
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('pickup-date').value = today;

        detectLocation();
    }

    function detectLocation() {
        const status = document.getElementById('geo-status');
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const pos = { lat: position.coords.latitude, lng: position.coords.longitude };
                    map.setCenter(pos);
                    geo.geocode({ location: pos }, (results, stat) => {
                        if (stat === "OK" && results[0]) {
                            document.getElementById('start').value = results[0].formatted_address;
                            status.innerText = "Location Secured";
                            status.classList.remove('detecting');
                            status.style.background = "rgba(0,255,0,0.1)";
                            status.style.color = "#00ff00";
                            calculateChain();
                        } else {
                            status.innerText = "GPS Active (Manual Address Needed)";
                        }
                    });
                },
                (error) => {
                    status.innerText = "Location Denied (Enter Manually)";
                    status.classList.remove('detecting');
                    status.style.color = "#ff4444";
                },
                { enableHighAccuracy: true }
            );
        } else {
            status.innerText = "Browser Unsupported";
        }
    }

    function setupAC(el) {
        const ac = new google.maps.places.Autocomplete(el, { componentRestrictions: { country: "jm" } });
        ac.addListener('place_changed', calculateChain);
    }

    function addNewStop() {
        const div = document.createElement('div');
        div.style.display = "flex"; div.style.gap = "10px"; div.style.marginBottom = "10px";
        const id = 's-' + Date.now();
        div.id = id;
        div.innerHTML = `<input type="text" placeholder="Next Stop" class="waypoint" style="flex:1;"><button onclick="document.getElementById('${id}').remove(); calculateChain();" style="background:none; border:1px solid #ff4444; color:#ff4444; border-radius:10px; width:40px; margin-bottom:10px;">×</button>`;
        document.getElementById('stops-list').appendChild(div);
        setupAC(div.querySelector('input'));
    }

    function calculateChain() {
        const origin = document.getElementById('start').value;
        const destination = document.getElementById('end').value;
        if (!origin || !destination) return;

        const wps = Array.from(document.querySelectorAll('.waypoint')).map(i => ({ location: i.value, stopover: true }));

        ds.route({
            origin, destination, waypoints: wps, travelMode: 'DRIVING', optimizeWaypoints: false
        }, (res, stat) => {
            if (stat === "OK") {
                dr.setDirections(res);
                let totalKM = 0;
                res.routes[0].legs.forEach(leg => totalKM += leg.distance.value / 1000);
                const totalJMD = Math.round((BASE + (totalKM * RATE)) / 10) * 10;
                document.getElementById('jmd-total').innerText = `$${totalJMD.toLocaleString()} JMD`;
                document.getElementById('usd-total').innerText = `$${(totalJMD / 156).toFixed(2)} USD`;
                document.getElementById('price-box').style.display = 'block';
            }
        });
    }

    function sendToWhatsApp() {
        const jmd = document.getElementById('jmd-total').innerText;
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        const date = document.getElementById('pickup-date').value;
        const time = document.getElementById('pickup-time').value;
        const stops = Array.from(document.querySelectorAll('.waypoint')).map(i => i.value).join(' -> ');
        
        if (!date || !time) {
            alert("Please specify a prompt Date and Time for your pickup.");
            return;
        }

        const msg = `*COOL COMFORT EXECUTIVE RESERVATION*\n--------------------------\n📅 DATE: ${date}\n⏰ TIME: ${time}\n\n📍 START: ${start}\n🛑 STOPS: ${stops || 'None'}\n🏁 END: ${end}\n💰 TOTAL FARE: ${jmd}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }

    window.onload = initMap;
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places&callback=initMap" async defer></script>
</body>
</html>
