<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Premier Island Logistics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places"></script>
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --glass: rgba(255, 255, 255, 0.08); --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: var(--white); overflow-x: hidden; }

        .hero { min-height: 100vh; background: linear-gradient(rgba(0,31,38,0.88), rgba(0,31,38,0.95)), url('Cover Photo.jpg'); background-size: cover; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 40px 20px; }
        
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 6vw, 3.2rem); color: var(--gold); margin: 0; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
        .motto { letter-spacing: 5px; font-size: 0.7rem; opacity: 0.7; text-transform: uppercase; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); padding: 5px 20px; display: inline-block; margin-top: 10px; text-align: center; }

        .booking-card { background: var(--glass); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); padding: 35px; border-radius: 40px; width: 100%; max-width: 550px; box-shadow: 0 50px 100px rgba(0,0,0,0.8); }

        /* Progress System */
        .progress-bar { display: flex; justify-content: space-between; margin-bottom: 35px; position: relative; width: 80%; margin-left: 10%; }
        .progress-line { position: absolute; top: 50%; left: 0; height: 1px; background: rgba(255,255,255,0.1); width: 100%; z-index: 1; transform: translateY(-50%); }
        .progress-fill { position: absolute; top: 50%; left: 0; height: 1px; background: var(--gold); width: 0%; z-index: 2; transition: 0.6s; transform: translateY(-50%); }
        .dot { width: 12px; height: 12px; background: #111; border-radius: 50%; z-index: 3; transition: 0.4s; border: 1px solid rgba(255,255,255,0.2); }
        .dot.active { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 15px var(--gold); }

        .step { display: none; animation: fadeIn 0.4s ease-out; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); margin-bottom: 25px; display: block; text-align: center; }

        /* Step 2: Directory */
        .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .cat-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .cat-btn:hover, .cat-btn.selected { border-color: var(--gold); background: rgba(212,175,55,0.1); }
        .cat-btn i { font-size: 1.4rem; color: var(--gold); display: block; margin-bottom: 6px; }
        .cat-btn span { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }

        .listing-area { max-height: 250px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 20px; padding: 12px; display: none; margin-bottom: 15px; }
        .list-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; border-radius: 12px; margin-bottom: 5px; }
        .list-item:hover { background: rgba(255,255,255,0.05); }
        .list-item.active { border-left: 4px solid var(--gold); background: rgba(212,175,55,0.08); }
        .list-item b { display: block; font-size: 0.85rem; color: var(--gold); }
        .list-item p { font-size: 0.65rem; opacity: 0.6; margin: 5px 0 0 0; }

        /* Step 4: Route Display */
        #final-map { width: 100%; height: 180px; border-radius: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .route-info { display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        .info-cell { text-align: center; flex: 1; border-right: 1px solid rgba(255,255,255,0.1); }
        .info-cell:last-child { border: none; }
        .info-cell span { display: block; font-size: 0.55rem; text-transform: uppercase; opacity: 0.5; margin-bottom: 5px; }
        .info-cell b { font-size: 0.9rem; color: var(--gold); }

        input, select { width: 100%; padding: 18px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; color: white; margin-bottom: 15px; font-family: inherit; font-size: 0.9rem; }
        input:focus { outline: none; border-color: var(--gold); }

        .btn-next { background: var(--gold); color: var(--navy); border: none; padding: 20px; border-radius: 20px; flex: 2; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 2px; }
        .btn-back { background: rgba(255,255,255,0.1); color: white; border: none; padding: 20px; border-radius: 20px; flex: 1; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<section class="hero">
    <h1>Cool Comfort</h1>
    <div class="motto">Chauffeured Excellence Across Jamaica</div>
    
    <div class="booking-card">
        <div class="progress-bar">
            <div class="progress-line"></div>
            <div class="progress-fill" id="progress-fill"></div>
            <div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>

        <div class="step active">
            <span class="label">01. Timeline</span>
            <select id="days" onchange="calc()">
                <option value="1">1 Day Exploration</option>
                <option value="3">3 Day Escape</option>
                <option value="7">7 Day Tour</option>
            </select>
            <input type="date" id="date"><input type="time" id="time">
        </div>

        <div class="step">
            <span class="label">02. Destinations</span>
            <div class="category-grid">
                <div class="cat-btn" onclick="show('resorts', this)"><i class="fa-solid fa-hotel"></i><span>Stays</span></div>
                <div class="cat-btn" onclick="show('nature', this)"><i class="fa-solid fa-water"></i><span>Nature</span></div>
            </div>
            <div id="list" class="listing-area"></div>
            <input type="text" id="custom" placeholder="Type a specific destination..." onkeyup="addCustom(event)">
        </div>

        <div class="step">
            <span class="label">03. Transit Logistics</span>
            <input type="text" id="pickup" placeholder="Pickup Location (e.g. Airport)">
            <input type="text" id="dropoff" placeholder="Final Destination">
        </div>

        <div class="step">
            <span class="label">04. Final Itinerary</span>
            <div id="final-map"></div>
            <div class="route-info">
                <div class="info-cell"><span>Travel Time</span><b id="duration">-</b></div>
                <div class="info-cell"><span>Distance</span><b id="dist">-</b></div>
                <div class="info-cell"><span>Quotation</span><b id="cost">$0 JMD</b></div>
            </div>
            <p style="text-align: center; font-size: 0.6rem; opacity: 0.5;">Includes 24/7 concierge and premium travel amenities.</p>
        </div>

        <div class="nav-buttons" style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn-back" id="back" onclick="nav(-1)" style="display:none;">Back</button>
            <button class="btn-next" id="next" onclick="nav(1)">Continue</button>
        </div>
    </div>
</section>

<script>
    let s = 0, pois = [], map, ds, dr;
    const db = {
        resorts: [
            { n: "Round Hill Hotel & Villas", d: "Montego Bay. Historic elegance and privacy." },
            { n: "Half Moon", d: "Rose Hall. Massive coastal luxury estate." },
            { n: "S Hotel Montego Bay", d: "Modern chic on Jimmy Cliff Blvd." }
        ],
        nature: [
            { n: "Dunn's River Falls", d: "Ocho Rios. World-famous terraced falls." },
            { n: "Blue Hole", d: "Lush tropical swimming lagoons." }
        ]
    };

    function nav(n) {
        const steps = document.querySelectorAll('.step');
        steps[s].classList.remove('active');
        s += n;
        if (s >= steps.length) { 
            const msg = `*RESERVATION*\nTimeline: ${document.getElementById('days').value} Days\nPickup: ${document.getElementById('pickup').value}\nDropoff: ${document.getElementById('dropoff').value}\nRoute Duration: ${document.getElementById('duration').innerText}\nPrice: ${document.getElementById('cost').innerText}`;
            window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
            s = steps.length - 1; 
        }
        steps[s].classList.add('active');
        document.getElementById('progress-fill').style.width = (s / 3) * 100 + "%";
        document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i <= s));
        document.getElementById('back').style.display = s === 0 ? 'none' : 'block';
        document.getElementById('next').innerText = s === 3 ? "Reserve Now" : "Continue";
        if (s === 3) setTimeout(loadMap, 50);
    }

    function show(c, el) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        document.getElementById('list').style.display = 'block';
        document.getElementById('list').innerHTML = db[c].map(i => `
            <div class="list-item ${pois.includes(i.n) ? 'active' : ''}" onclick="tag('${i.n}', this)">
                <b>${i.n}</b><p>${i.d}</p>
            </div>`).join('');
    }

    function tag(n, el) {
        pois.includes(n) ? pois = pois.filter(p => p !== n) : pois.push(n);
        el.classList.toggle('active');
    }

    function addCustom(e) { if(e.key === 'Enter' && e.target.value) { pois.push(e.target.value); e.target.value = ""; alert("Added destination."); } }

    function loadMap() {
        if (!map) {
            map = new google.maps.Map(document.getElementById("final-map"), { zoom: 9, center: { lat: 18.2, lng: -77.3 }, mapTypeId: 'hybrid', disableDefaultUI: true });
            ds = new google.maps.DirectionsService();
            dr = new google.maps.DirectionsRenderer({ map, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 4 } });
            new google.maps.places.Autocomplete(document.getElementById('pickup'));
            new google.maps.places.Autocomplete(document.getElementById('dropoff'));
        }
        calc();
    }

    function calc() {
        const p = document.getElementById('pickup').value, d = document.getElementById('dropoff').value;
        if (!p || !d) return;
        ds.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (r, st) => {
            if (st === "OK") {
                dr.setDirections(r);
                document.getElementById('duration').innerText = r.routes[0].legs[0].duration.text;
                document.getElementById('dist').innerText = r.routes[0].legs[0].distance.text;
                const total = Math.round(((600 + (r.routes[0].legs[0].distance.value / 1000 * 155)) * document.getElementById('days').value) / 10) * 10;
                document.getElementById('cost').innerText = `$${total.toLocaleString()} JMD`;
            }
        });
    }
</script>
</body>
</html>
