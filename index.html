<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Precision Fixed</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- IMPORTANT: Replace YOUR_API_KEY with your actual Google Maps API Key -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places,geometry"></script>
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --white: #ffffff; --glass: rgba(255, 255, 255, 0.12); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: var(--white); 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden;
        }

        .hero-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,31,38,0.85), rgba(0,31,38,0.95)), url('Cover Photo.jpg');
            background-size: cover; background-position: center; z-index: -1;
        }
        
        .booking-card { 
            width: 92%; max-width: 450px; height: 88vh; max-height: 780px;
            background: var(--glass); backdrop-filter: blur(50px); 
            border-radius: 40px; border: 1px solid rgba(255,255,255,0.15); 
            display: flex; flex-direction: column; position: relative;
        }

        .card-header { padding: 30px 30px 10px 30px; }
        .progress-bar-container { display: flex; justify-content: space-between; position: relative; margin-bottom: 25px; }
        .line-bg { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(255,255,255,0.1); z-index: 1; }
        .line-fill { position: absolute; top: 50%; left: 0; width: 0%; height: 1px; background: var(--gold); z-index: 2; transition: 0.6s; }
        .dot { width: 10px; height: 10px; background: #111; border-radius: 50%; z-index: 3; transition: 0.4s; }
        .dot.active { background: var(--gold); box-shadow: 0 0 10px var(--gold); }

        .card-content { flex-grow: 1; overflow-y: auto; padding: 0 30px; scrollbar-width: none; }
        .card-content::-webkit-scrollbar { display: none; }

        .step { display: none; animation: slideUp 0.4s ease-out; }
        .step.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .section-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 4px; color: var(--gold); margin-bottom: 25px; display: block; text-align: center; }

        /* Map Fixes */
        #map { 
            width: 100%; height: 200px; border-radius: 25px; margin-bottom: 20px; 
            border: 1px solid rgba(255,255,255,0.15); background: #000;
        }

        /* Input Styling */
        input, select { 
            width: 100%; padding: 18px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 18px; color: white; font-family: inherit; font-size: 0.95rem; margin-bottom: 15px;
        }
        input:focus { border-color: var(--gold); outline: none; }

        /* Google Autocomplete List Fix */
        .pac-container { 
            background: #001f26 !important; border: 1px solid var(--gold) !important; 
            border-radius: 15px !important; margin-top: 5px; z-index: 10000 !important; 
        }
        .pac-item { color: white !important; border-top: 1px solid rgba(255,255,255,0.1) !important; padding: 10px !important; }
        .pac-item:hover { background: rgba(212,175,55,0.1) !important; }
        .pac-item-query { color: var(--gold) !important; font-weight: 700 !important; }

        .card-footer { padding: 25px 30px 40px 30px; display: flex; gap: 12px; }
        .btn-primary { background: var(--gold); color: var(--navy); border: none; padding: 20px; border-radius: 18px; flex: 2; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: none; padding: 20px; border-radius: 18px; flex: 1; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div class="hero-bg"></div>

<div class="booking-card">
    <div class="card-header">
        <div class="progress-bar-container">
            <div class="line-bg"></div>
            <div class="line-fill" id="line-fill"></div>
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="card-content" id="scroll-area">
        
        <!-- STEP 1: LOGISTICS -->
        <div class="step active">
            <span class="section-label">01. Arrival Logistics</span>
            <div id="map"></div>
            <input type="text" id="pickup" placeholder="Pickup (Hotel, Airport, Port)">
            <input type="text" id="destination" placeholder="Destination (Resort, Villa)">
            <input type="date" id="date">
            <input type="time" id="time">
        </div>

        <!-- STEP 2: FLEET -->
        <div class="step">
            <span class="section-label">02. Elite Fleet</span>
            <!-- Fleet Selection Logic -->
            <select id="vehicle" onchange="updateFare()">
                <option value="155">Executive Sedan</option>
                <option value="230">Luxury SUV</option>
                <option value="350">Private Van</option>
            </select>
        </div>

        <!-- STEP 3: PRICE -->
        <div class="step">
            <span class="section-label">03. Review & Fare</span>
            <div style="text-align: center; padding: 30px; background: rgba(212,175,55,0.1); border-radius: 25px; border: 1px solid var(--gold);">
                <span id="fare-jmd" style="font-size: 2rem; font-weight: 700; color: var(--gold); display: block;">$0 JMD</span>
                <span id="fare-usd" style="opacity: 0.6;">≈ $0.00 USD</span>
            </div>
        </div>

    </div>

    <div class="card-footer">
        <button class="btn-secondary" id="backBtn" onclick="move(-1)" style="display:none;">Back</button>
        <button class="btn-primary" id="nextBtn" onclick="move(1)">Continue</button>
    </div>
</div>

<script>
    let currentStep = 0;
    let map, directionsService, directionsRenderer;
    let pickupLoc = null, destLoc = null;

    function move(n) {
        const steps = document.querySelectorAll('.step');
        steps[currentStep].classList.remove('active');
        currentStep += n;

        if (currentStep >= steps.length) {
            sendWhatsApp();
            currentStep = steps.length - 1;
        }

        steps[currentStep].classList.add('active');
        document.getElementById('backBtn').style.display = currentStep === 0 ? 'none' : 'block';
        document.getElementById('nextBtn').innerText = currentStep === steps.length - 1 ? "Confirm" : "Continue";
        
        const dots = document.querySelectorAll('.dot');
        document.getElementById('line-fill').style.width = (currentStep / (dots.length - 1)) * 100 + "%";
        dots.forEach((d, i) => d.classList.toggle('active', i <= currentStep));
        
        if (currentStep === 0) {
            // Trigger map resize if hidden previously
            google.maps.event.trigger(map, "resize");
        }
    }

    // MAP INITIALIZATION
    function initMap() {
        // Center on Jamaica
        const jamaica = { lat: 18.1096, lng: -77.2975 };
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 8,
            center: jamaica,
            disableDefaultUI: true,
            styles: [
                { "elementType": "geometry", "stylers": [{ "color": "#212121" }] },
                { "elementType": "labels.text.fill", "stylers": [{ "color": "#757575" }] },
                { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#303030" }] },
                { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#000000" }] }
            ]
        });

        directionsService = new google.maps.DirectionsService();
        directionsRenderer = new google.maps.DirectionsRenderer({
            map: map,
            polylineOptions: { strokeColor: "#d4af37", strokeWeight: 5 }
        });

        // AUTOCOMPLETE SETUP
        const options = { 
            componentRestrictions: { country: "jm" }, 
            fields: ["formatted_address", "geometry"] 
        };
        
        const acPickup = new google.maps.places.Autocomplete(document.getElementById('pickup'), options);
        const acDest = new google.maps.places.Autocomplete(document.getElementById('destination'), options);

        acPickup.addListener('place_changed', () => {
            const place = acPickup.getPlace();
            if (place.geometry) {
                pickupLoc = place.formatted_address;
                updateFare();
            }
        });

        acDest.addListener('place_changed', () => {
            const place = acDest.getPlace();
            if (place.geometry) {
                destLoc = place.formatted_address;
                updateFare();
            }
        });
    }

    function updateFare() {
        if (!pickupLoc || !destLoc) return;

        directionsService.route({
            origin: pickupLoc,
            destination: destLoc,
            travelMode: google.maps.TravelMode.DRIVING
        }, (response, status) => {
            if (status === "OK") {
                directionsRenderer.setDirections(response);
                const distanceKm = response.routes[0].legs[0].distance.value / 1000;
                const rate = document.getElementById('vehicle').value;
                
                // Base 2500 + (Rate per km * distance)
                const totalJMD = Math.round((2500 + (distanceKm * rate)) / 100) * 100;
                document.getElementById('fare-jmd').innerText = `$${totalJMD.toLocaleString()} JMD`;
                document.getElementById('fare-usd').innerText = `≈ $${(totalJMD / 156).toFixed(2)} USD`;
            }
        });
    }

    function sendWhatsApp() {
        const msg = `*NEW RESERVATION*\n\n` +
                    `Date: ${document.getElementById('date').value}\n` +
                    `Time: ${document.getElementById('time').value}\n` +
                    `Pickup: ${pickupLoc}\n` +
                    `Dest: ${destLoc}\n` +
                    `Fare: ${document.getElementById('fare-jmd').innerText}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }

    // Call init on load
    window.onload = initMap;
</script>
</body>
</html>
