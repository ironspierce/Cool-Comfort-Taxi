<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Premier Island Logistics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.paypal.com/sdk/js?client-id=BAA8P6X3C7B5W&merchant-id=26SBN3BDG55FQ&currency=USD"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places,geometry"></script>
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --glass: rgba(255, 255, 255, 0.06); --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: var(--white); overflow-x: hidden; }

        /* Elegant Parallax Background */
        .hero { min-height: 100vh; background: linear-gradient(rgba(0,31,38,0.8), rgba(0,31,38,0.95)), url('Cover Photo.jpg'); background-size: cover; background-attachment: fixed; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 40px 20px; }
        
        .header-box { text-align: center; margin-bottom: 50px; }
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 8vw, 4rem); color: var(--gold); margin: 0; letter-spacing: 8px; text-transform: uppercase; }
        .tagline { letter-spacing: 5px; font-size: 0.7rem; opacity: 0.8; text-transform: uppercase; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); padding: 5px 20px; display: inline-block; margin-top: 15px; }

        /* Main Service Portal */
        .portal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; width: 100%; max-width: 900px; animation: fadeIn 1s ease; }
        .service-card { background: var(--glass); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 40px; cursor: pointer; transition: 0.4s; text-align: center; }
        .service-card:hover { transform: translateY(-10px); border-color: var(--gold); background: rgba(212,175,55,0.05); }
        .service-card i { font-size: 3rem; color: var(--gold); margin-bottom: 20px; display: block; }
        .service-card h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin: 0; color: var(--gold); }
        .service-card p { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; opacity: 0.6; }

        /* Unified Booking Interface */
        .booking-ui { display: none; background: var(--glass); backdrop-filter: blur(50px); border: 1px solid rgba(255,255,255,0.15); padding: 35px; border-radius: 50px; width: 100%; max-width: 650px; box-shadow: 0 50px 100px rgba(0,0,0,0.8); }
        .active-ui { display: block; animation: slideIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }

        #map-v { width: 100%; height: 220px; border-radius: 30px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
        input, select { width: 100%; padding: 18px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; color: white; margin-bottom: 15px; font-family: inherit; font-size: 0.9rem; }
        
        .premium-btn { background: var(--gold); color: var(--navy); border: none; padding: 22px; border-radius: 20px; width: 100%; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 3px; font-size: 1rem; transition: 0.3s; }
        .premium-btn:hover { box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); }

        /* Discovery Catalog */
        .catalog { max-height: 380px; overflow-y: auto; background: rgba(0,0,0,0.25); border-radius: 30px; padding: 15px; margin-bottom: 20px; }
        .catalog-item { background: rgba(255,255,255,0.03); border-radius: 20px; overflow: hidden; margin-bottom: 15px; cursor: pointer; border: 1px solid transparent; transition: 0.3s; display: flex; align-items: center; }
        .catalog-item.active { border-color: var(--gold); background: rgba(212,175,55,0.1); }
        .item-thumb { width: 100px; height: 100px; background-size: cover; background-position: center; flex-shrink: 0; }
        .item-meta { padding: 15px; flex-grow: 1; }
        .item-meta b { color: var(--gold); font-size: 0.9rem; }
        .item-meta p { font-size: 0.65rem; opacity: 0.6; margin: 4px 0 0 0; }

        /* Fare Panel */
        .fare-box { text-align: center; padding: 25px; background: rgba(0,0,0,0.5); border-radius: 30px; border: 1px solid var(--gold); margin-bottom: 20px; }
        .fare-row { display: flex; justify-content: center; align-items: baseline; gap: 10px; }
        .jmd { font-size: 2.2rem; font-weight: 700; color: var(--gold); }
        .usd { font-size: 1rem; opacity: 0.7; }

        .back-nav { color: var(--gold); cursor: pointer; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-bottom: 20px; display: inline-block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<section class="hero">
    <div class="header-box" id="header">
        <h1>Cool Comfort</h1>
        <div class="tagline">The Gold Standard of Jamaican Logistics</div>
    </div>

    <div class="portal-grid" id="portal">
        <div class="service-card" onclick="initBooking('taxi')">
            <i class="fa-solid fa-bolt-lightning"></i>
            <h2>Instant Taxi</h2>
            <p>On-Demand Executive Transit</p>
        </div>
        <div class="service-card" onclick="initBooking('tour')">
            <i class="fa-solid fa-crown"></i>
            <h2>Appointment</h2>
            <p>Curated Luxury Island Tours</p>
        </div>
    </div>

    <div class="booking-ui" id="ui-container">
        <span class="back-nav" onclick="exitToPortal()"><i class="fa-solid fa-arrow-left"></i> Return to Portal</span>
        
        <div id="discovery-stage" style="display:none;">
            <input type="text" id="custom-search" placeholder="Type a specific resort or villa name..." onkeyup="addCustom(event)">
            <div class="catalog" id="tour-catalog"></div>
            <button class="premium-btn" onclick="goToLogistics()">Continue to Schedule</button>
        </div>

        <div id="logistics-stage">
            <div id="map-v"></div>
            <input type="text" id="p-input" placeholder="Origin (Precise Location)">
            <input type="text" id="d-input" placeholder="Destination">
            <div id="tour-date-wrap" style="display:none;">
                <input type="date" id="t-date">
            </div>
            
            <div style="background:rgba(212,175,55,0.1); padding:15px; border-radius:15px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:0.75rem; font-weight:700;">Include Return Journey (-10%)</span>
                <input type="checkbox" id="ret-trip" style="width:20px; margin:0;" onchange="calculate()">
            </div>

            <div class="fare-box" id="fare-panel" style="display:none;">
                <div class="fare-row">
                    <span class="jmd" id="price-jmd">$0</span>
                    <span class="usd" id="price-usd">≈ $0.00 USD</span>
                </div>
                <div id="paypal-v" style="margin-top:15px; display:none;"></div>
            </div>

            <select id="pay-mode" onchange="togglePay()">
                <option value="cash">Settle with Cash at Destination</option>
                <option value="paypal">Settle via PayPal / Digital Card</option>
            </select>

            <button class="premium-btn" id="final-btn" onclick="finalize()">Confirm Reservation</button>
        </div>
    </div>
</section>

<script>
    let mode = '', map, ds, dr, geo, userPos = "";
    let base = 600, selectedSites = [];

    const tours = [
        { n: "Doctor's Cave Beach", p: 4000, img: "https://images.unsplash.com/photo-1545532555-90141f021235?auto=format&w=200", d: "St. James. World-famous crystal mineral waters." },
        { n: "Luminous Lagoon", p: 7000, img: "https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&w=200", d: "Trelawny. A rare glowing bioluminescent phenomenon." },
        { n: "Dunn's River Falls", p: 9500, img: "https://images.unsplash.com/photo-1596328546171-77e37b5e8b3d?auto=format&w=200", d: "St. Ann. The climb of a lifetime on a tiered waterfall." },
        { n: "Rick's Cafe Negril", p: 12000, img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&w=200", d: "Westmoreland. Cliff jumping and the world's best sunset." }
    ];

    function initBooking(m) {
        mode = m;
        document.getElementById('portal').style.display = 'none';
        document.getElementById('header').style.display = 'none';
        document.getElementById('ui-container').classList.add('active-ui');
        
        if (m === 'tour') {
            document.getElementById('discovery-stage').style.display = 'block';
            document.getElementById('logistics-stage').style.display = 'none';
            renderCatalog();
        } else {
            document.getElementById('logistics-stage').style.display = 'block';
            document.getElementById('tour-date-wrap').style.display = 'none';
            setTimeout(initMap, 100);
        }
    }

    function exitToPortal() { location.reload(); }

    function renderCatalog() {
        document.getElementById('tour-catalog').innerHTML = tours.map(t => `
            <div class="catalog-item" id="item-${t.n.replace(/\s/g,'')}" onclick="toggleSite('${t.n}', ${t.p})">
                <div class="item-thumb" style="background-image:url('${t.img}')"></div>
                <div class="item-meta"><b>${t.n}</b><p>${t.d}</p></div>
            </div>`).join('');
    }

    function toggleSite(n, p) {
        const el = document.getElementById('item-'+n.replace(/\s/g,''));
        if (selectedSites.includes(n)) {
            selectedSites = selectedSites.filter(x => x !== n);
            base -= p; el.classList.remove('active');
        } else {
            selectedSites.push(n);
            base += p; el.classList.add('active');
        }
    }

    function goToLogistics() {
        document.getElementById('discovery-stage').style.display = 'none';
        document.getElementById('logistics-stage').style.display = 'block';
        document.getElementById('tour-date-wrap').style.display = 'block';
        setTimeout(initMap, 100);
    }

    function initMap() {
        if (map) return;
        ds = new google.maps.DirectionsService();
        geo = new google.maps.Geocoder();
        map = new google.maps.Map(document.getElementById("map-v"), { zoom: 14, center: { lat: 18.47, lng: -77.89 }, mapTypeId: 'hybrid', disableDefaultUI: true });
        dr = new google.maps.DirectionsRenderer({ map, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 6 } });
        
        setupAutocomplete(document.getElementById('p-input'));
        setupAutocomplete(document.getElementById('d-input'));
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                userPos = `${p.coords.latitude},${p.coords.longitude}`;
                map.setCenter({ lat: p.coords.latitude, lng: p.coords.longitude });
                geo.geocode({ location: { lat: p.coords.latitude, lng: p.coords.longitude } }, (r, s) => {
                    if (s === "OK" && r[0]) document.getElementById('p-input').value = r[0].formatted_address;
                });
            }, null, { enableHighAccuracy: true });
        }
    }

    function setupAutocomplete(input) {
        const ac = new google.maps.places.Autocomplete(input, { componentRestrictions: { country: "jm" } });
        ac.addListener('place_changed', calculate);
    }

    function calculate() {
        const p = document.getElementById('p-input').value, d = document.getElementById('d-input').value;
        if (!p || !d) return;
        ds.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (res, stat) => {
            if (stat === "OK") {
                dr.setDirections(res);
                const km = res.routes[0].legs[0].distance.value / 1000;
                let fare = base + (km * 155);
                if (document.getElementById('ret-trip').checked) fare *= 1.9;
                const rounded = Math.round(fare / 10) * 10;
                
                document.getElementById('price-jmd').innerText = `$${rounded.toLocaleString()} JMD`;
                document.getElementById('price-usd').innerText = `≈ $${(rounded / 156).toFixed(2)} USD`;
                document.getElementById('fare-panel').style.display = 'block';
                renderPay((rounded / 156).toFixed(2));
            }
        });
    }

    function togglePay() {
        document.getElementById('paypal-v').style.display = (document.getElementById('pay-mode').value === 'paypal') ? 'block' : 'none';
    }

    function renderPay(amt) {
        document.getElementById('paypal-v').innerHTML = '';
        paypal.Buttons({ createOrder: (data, actions) => actions.order.create({ purchase_units: [{ amount: { value: amt } }] }) }).render('#paypal-v');
    }

    function finalize() {
        const gpsLink = userPos ? `https://www.google.com/maps?q=${userPos}` : "Manual Entry";
        const msg = `*COOL COMFORT RESERVATION*\n--------------------------\nType: ${mode.toUpperCase()}\nPickup: ${document.getElementById('p-input').value}\nDest: ${document.getElementById('d-input').value}\nGPS: ${gpsLink}\nStops: ${selectedSites.join(', ') || 'Direct'}\nTotal: ${document.getElementById('price-jmd').innerText}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }

    function addCustom(e) {
        if (e.key === 'Enter') {
            const v = e.target.value.trim();
            if (v) { selectedSites.push(v); base += 5000; e.target.value = ""; alert("Custom Spot Added: " + v); }
        }
    }
</script>
</body>
</html>
