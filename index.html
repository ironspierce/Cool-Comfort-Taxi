<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Premium Jamaica Pickup</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --teal: #008080; --navy: #002b36; --gold: #ffcc00; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--white); color: var(--navy); }
        header { background: linear-gradient(135deg, var(--navy), var(--teal)); color: white; padding: 2rem; text-align: center; border-bottom: 5px solid var(--gold); }
        .booking-card { max-width: 500px; margin: -40px auto 40px; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { background: var(--gold); color: var(--navy); padding: 1rem; border: none; font-weight: bold; width: 100%; border-radius: 5px; cursor: pointer; text-transform: uppercase; }
        #price-display { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; text-align: center; border: 1px dashed var(--teal); }
        .pi-badge { background: var(--gold); padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>

<header>
    <h1>COOL <span style="color:var(--gold)">COMFORT</span></h1>
    <p>Professional Taxi & Island Tours</p>
</header>

<section class="booking-card">
    <h3><span class="pi-badge">PI</span> INSTANT FARE QUOTE</h3>
    <div class="input-group">
        <input type="text" id="pickup" placeholder="Pickup (e.g., MBJ Airport or Hotel Name)">
    </div>
    <div class="input-group">
        <input type="text" id="destination" placeholder="Destination (e.g., Rick's Cafe)">
    </div>

    <div id="price-display">
        <p id="distance-info" style="color:var(--teal); font-weight:bold;"></p>
        <h2 id="usd-total" style="margin: 5px 0;">$0.00 USD</h2>
        <h3 id="jmd-total" style="color:#777; margin: 0;">$0 JMD</h3>
        <p style="font-size:0.7rem; color:#999; margin-top:10px;">*Price includes fuel, driver time, and vehicle maintenance.</p>
    </div>
    
    <button class="btn" onclick="sendWhatsApp()" style="margin-top:15px;">Book Ride via WhatsApp</button>
</section>

<script>
    function initMap() {
        const options = { componentRestrictions: { country: "jm" } };
        const pAutocomplete = new google.maps.places.Autocomplete(document.getElementById('pickup'), options);
        const dAutocomplete = new google.maps.places.Autocomplete(document.getElementById('destination'), options);

        dAutocomplete.addListener('place_changed', () => {
            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: [document.getElementById('pickup').value],
                destinations: [document.getElementById('destination').value],
                travelMode: 'DRIVING',
            }, (response, status) => {
                if (status === 'OK') {
                    const data = response.rows[0].elements[0];
                    if (data.status === "OK") {
                        const km = data.distance.value / 1000;
                        
                        // PRICING LOGIC
                        const baseFareUSD = 15.00;
                        const ratePerKmUSD = 1.35;
                        const exchangeRate = 156.00; 
                        
                        const totalUSD = baseFareUSD + (km * ratePerKmUSD);
                        const totalJMD = totalUSD * exchangeRate;

                        document.getElementById('distance-info').innerText = km.toFixed(1) + " km Trip";
                        document.getElementById('usd-total').innerText = "$" + totalUSD.toFixed(2) + " USD";
                        document.getElementById('jmd-total').innerText = "$" + Math.round(totalJMD).toLocaleString() + " JMD";
                        document.getElementById('price-display').style.display = "block";
                    }
                }
            });
        });
    }
    window.onload = initMap;

    function sendWhatsApp() {
        const pickup = document.getElementById('pickup').value;
        const destination = document.getElementById('destination').value;
        const price = document.getElementById('usd-total').innerText;
        const text = `Hi Pierce, I'd like to book a Cool Comfort ride.\n\nFrom: ${pickup}\nTo: ${destination}\nQuote: ${price}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(text)}`);
    }
</script>

</body>
</html>
