<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | Precision Luxury</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.paypal.com/sdk/js?client-id=BAA8P6X3C7B5W&merchant-id=26SBN3BDG55FQ&currency=USD"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places"></script>
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --glass: rgba(255, 255, 255, 0.08); --white: #ffffff; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: var(--white); overflow-x: hidden; }

        .hero { position: relative; min-height: 100vh; width: 100%; background: linear-gradient(rgba(0,31,38,0.7), rgba(0,31,38,0.9)), url('Cover Photo.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        
        .booking-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); padding: 25px; border-radius: 30px; width: 100%; max-width: 500px; box-shadow: 0 40px 80px rgba(0,0,0,0.6); }
        
        h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--gold); text-align: center; margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 2px; }

        .tracking-status { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); border-radius: 12px; padding: 10px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; color: var(--gold); }
        .pulse-icon { width: 10px; height: 10px; background: #4caf50; border-radius: 50%; box-shadow: 0 0 8px #4caf50; animation: pulse 1.5s infinite; }

        #map { width: 100%; height: 220px; border-radius: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }

        .input-group { margin-bottom: 12px; position: relative; }
        input { width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: white; font-family: inherit; font-size: 0.85rem; }
        
        .locate-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); cursor: pointer; font-size: 1.2rem; }

        /* Single Fleet Indicator */
        .fleet-confirmed { background: rgba(212, 175, 55, 0.15); border: 1px solid var(--gold); border-radius: 14px; padding: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .fleet-confirmed i { color: var(--gold); font-size: 1.2rem; }
        .fleet-confirmed span { font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

        .fee-display { background: rgba(0,0,0,0.4); border: 1px solid var(--gold); border-radius: 18px; padding: 15px; margin-bottom: 15px; text-align: center; display: none; }
        .fee-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); margin-bottom: 5px; opacity: 0.8; }
        .fee-amount { font-size: 1.8rem; font-weight: 700; color: #fff; margin: 0; }
        .fee-usd { font-size: 0.8rem; opacity: 0.6; margin-top: 2px; }

        .btn-book { background: var(--gold); color: var(--navy); padding: 18px; border: none; width: 100%; border-radius: 14px; font-weight: 700; text-transform: uppercase; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; }
        .btn-book:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); }

        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<section class="hero">
    <div class="booking-card">
        <h1>Cool Comfort</h1>
        
        <div class="tracking-status">
            <div class="pulse-icon"></div>
            <span id="location-text">ENHANCED SATELLITE GPS ACTIVE</span>
        </div>

        <div id="map"></div>
        
        <div class="input-group">
            <input type="text" id="pickup" placeholder="Pickup point...">
            <i class="fa-solid fa-location-arrow locate-btn" onclick="getPrecisionLocation()"></i>
        </div>

        <div class="input-group">
            <input type="text" id="destination" placeholder="Enter Destination">
        </div>

        <div class="fleet-confirmed">
            <i class="fa-solid fa-car-side"></i>
            <span>Executive 2018 Toyota Fielder</span>
        </div>

        <div id="fee-box" class="fee-display">
            <div class="fee-label">Proposed Fee</div>
            <div id="jmd-price" class="fee-amount">$0 JMD</div>
            <div id="usd-price" class="fee-usd">≈ $0.00 USD</div>
        </div>

        <button class="btn-book" onclick="sendWhatsApp()">
            <i class="fab fa-whatsapp"></i> RESERVE NOW
        </button>
    </div>
</section>

<script>
    let map, ds, dr, geocoder, userMarker;
    const KM_RATE = 155;
    const BASE_FARE = 600;
    const EX_RATE = 156;

    function initMap() {
        const defaultPos = { lat: 18.4762, lng: -77.8938 };
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 14, center: defaultPos, disableDefaultUI: true, mapTypeId: 'hybrid' 
        });
        
        ds = new google.maps.DirectionsService();
        dr = new google.maps.DirectionsRenderer({ map: map, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 5 } });
        geocoder = new google.maps.Geocoder();

        const acP = new google.maps.places.Autocomplete(document.getElementById('pickup'), { componentRestrictions: { country: "jm" } });
        const acD = new google.maps.places.Autocomplete(document.getElementById('destination'), { componentRestrictions: { country: "jm" } });

        acP.addListener('place_changed', calculateProposedFee);
        acD.addListener('place_changed', calculateProposedFee);

        getPrecisionLocation();
    }

    function calculateProposedFee() {
        const pickup = document.getElementById('pickup').value;
        const dest = document.getElementById('destination').value;
        if (!pickup || !dest) return;

        ds.route({ origin: pickup, destination: dest, travelMode: 'DRIVING' }, (res, stat) => {
            if (stat === 'OK') {
                dr.setDirections(res);
                const km = res.routes[0].legs[0].distance.value / 1000;
                const total = Math.round((BASE_FARE + (km * KM_RATE)) / 10) * 10;
                
                document.getElementById('jmd-price').innerText = `$${total.toLocaleString()} JMD`;
                document.getElementById('usd-price').innerText = `≈ $${(total / EX_RATE).toFixed(2)} USD`;
                document.getElementById('fee-box').style.display = 'block';
            }
        });
    }

    function getPrecisionLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const pos = { lat: position.coords.latitude, lng: position.coords.longitude };
                map.setCenter(pos);
                map.setZoom(17);

                if (userMarker) userMarker.setMap(null);
                userMarker = new google.maps.Marker({
                    position: pos, map: map,
                    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#4caf50', fillOpacity: 1, strokeColor: 'white', strokeWeight: 2 }
                });

                geocoder.geocode({ location: pos }, (results, status) => {
                    if (status === "OK" && results[0]) {
                        document.getElementById('pickup').value = results[0].formatted_address;
                        calculateProposedFee();
                    }
                });
            }, null, { enableHighAccuracy: true });
        }
    }

    function sendWhatsApp() {
        const pickup = document.getElementById('pickup').value;
        const dest = document.getElementById('destination').value;
        const fee = document.getElementById('jmd-price').innerText;
        const msg = `*COOL COMFORT LUXURY RESERVATION*\n--------------------------\n✨ VEHICLE: 2018 Toyota Fielder\n📍 PICKUP: ${pickup}\n🏁 DESTINATION: ${dest}\n💰 PROPOSED FEE: ${fee}\n🛰️ STATUS: Satellite Verified`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }

    window.onload = initMap;
</script>

</body>
</html>
