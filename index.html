<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | System Recovery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --glass: rgba(255, 255, 255, 0.1); }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: #fff; }
        
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; background: radial-gradient(circle, #003a47 0%, #001f26 100%); }
        
        /* The Card */
        .card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 40px; width: 100%; max-width: 500px; box-shadow: 0 40px 80px rgba(0,0,0,0.5); z-index: 10; }
        
        h1 { font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; margin-bottom: 30px; letter-spacing: 2px; }

        /* Map Container - Forced Visibility */
        #map-v { width: 100%; height: 250px; border-radius: 20px; margin-bottom: 20px; background: #111; border: 1px solid var(--gold); position: relative; z-index: 5; }

        input { width: 100%; padding: 18px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 15px; color: #fff; margin-bottom: 15px; font-size: 16px; }
        
        .btn { background: var(--gold); color: var(--navy); padding: 20px; border: none; border-radius: 15px; width: 100%; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }

        /* Fix for Search Suggestions */
        .pac-container { z-index: 99999 !important; border-radius: 10px; margin-top: 5px; }

        #debug-log { font-size: 10px; color: #ff4444; text-align: center; margin-top: 20px; opacity: 0.7; }
    </style>
</head>
<body>

<section class="hero">
    <div class="card">
        <h1>COOL COMFORT</h1>
        
        <div id="map-v"></div>
        
        <input type="text" id="p-in" placeholder="Pickup Address">
        <input type="text" id="d-in" placeholder="Destination">
        
        <div id="price-box" style="display:none; text-align:center; margin-bottom:20px;">
            <div id="price-jmd" style="font-size:24px; font-weight:700; color:var(--gold);">Calculating...</div>
        </div>

        <button class="btn" onclick="sendToWhatsapp()">Book via WhatsApp</button>
        
        <div id="debug-log">System Status: Waiting for Google...</div>
    </div>
</section>

<script>
    let map, ds, dr, geo, isLoaded = false;

    function log(msg) { document.getElementById('debug-log').innerText = "Status: " + msg; }

    function initMap() {
        log("Google Maps Ready.");
        isLoaded = true;
        try {
            ds = new google.maps.DirectionsService();
            geo = new google.maps.Geocoder();
            
            const mbay = { lat: 18.476, lng: -77.893 };
            map = new google.maps.Map(document.getElementById("map-v"), {
                zoom: 14, center: mbay, mapTypeId: 'hybrid', disableDefaultUI: true
            });
            
            dr = new google.maps.DirectionsRenderer({ map: map });

            const acP = new google.maps.places.Autocomplete(document.getElementById('p-in'));
            const acD = new google.maps.places.Autocomplete(document.getElementById('d-in'));
            
            acP.addListener('place_changed', calc);
            acD.addListener('place_changed', calc);

            // Auto-locate
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const myLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    map.setCenter(myLoc);
                    geo.geocode({ location: myLoc }, (results, status) => {
                        if (status === "OK") document.getElementById('p-in').value = results[0].formatted_address;
                    });
                });
            }
        } catch (e) {
            log("Error during init: " + e.message);
        }
    }

    function calc() {
        const p = document.getElementById('p-in').value;
        const d = document.getElementById('d-in').value;
        if (!p || !d) return;

        ds.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (res, stat) => {
            if (stat === 'OK') {
                dr.setDirections(res);
                const km = res.routes[0].legs[0].distance.value / 1000;
                const total = Math.round((600 + (km * 155)) / 10) * 10;
                document.getElementById('price-jmd').innerText = "$" + total.toLocaleString() + " JMD";
                document.getElementById('price-box').style.display = 'block';
            } else {
                log("Route Error: " + stat);
            }
        });
    }

    function sendToWhatsapp() {
        const p = document.getElementById('p-in').value;
        const d = document.getElementById('d-in').value;
        const price = document.getElementById('price-jmd').innerText;
        const msg = `*NEW BOOKING*\nPickup: ${p}\nDest: ${d}\nPrice: ${price}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(msg)}`);
    }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places&callback=initMap" async defer></script>

</body>
</html>
