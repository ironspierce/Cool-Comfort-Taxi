<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | The Gold Standard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places"></script>
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --glass: rgba(255, 255, 255, 0.08); --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: var(--white); overflow-x: hidden; }

        .hero { min-height: 100vh; background: linear-gradient(rgba(0,31,38,0.85), rgba(0,31,38,0.95)), url('Cover Photo.jpg'); background-size: cover; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 40px 20px; }
        
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 6vw, 3.5rem); color: var(--gold); margin: 0; letter-spacing: 4px; text-transform: uppercase; text-align: center; }
        .motto { letter-spacing: 5px; font-size: 0.75rem; opacity: 0.8; text-transform: uppercase; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); padding: 5px 20px; display: inline-block; margin-top: 10px; text-align: center; }

        .booking-card { background: var(--glass); backdrop-filter: blur(35px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 40px; width: 100%; max-width: 550px; box-shadow: 0 50px 100px rgba(0,0,0,0.7); }

        /* Progress Dots */
        .progress-bar { display: flex; justify-content: space-between; margin-bottom: 30px; position: relative; width: 80%; margin-left: 10%; }
        .progress-line { position: absolute; top: 50%; left: 0; height: 1px; background: rgba(255,255,255,0.1); width: 100%; z-index: 1; transform: translateY(-50%); }
        .progress-fill { position: absolute; top: 50%; left: 0; height: 1px; background: var(--gold); width: 0%; z-index: 2; transition: 0.6s; transform: translateY(-50%); }
        .dot { width: 10px; height: 10px; background: #222; border-radius: 50%; z-index: 3; transition: 0.4s; border: 1px solid rgba(255,255,255,0.2); }
        .dot.active { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 15px var(--gold); }

        .step { display: none; animation: fadeIn 0.5s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); margin-bottom: 20px; display: block; text-align: center; }

        /* Experience Categories */
        .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .cat-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .cat-btn:hover, .cat-btn.selected { border-color: var(--gold); background: rgba(212,175,55,0.1); }
        .cat-btn i { font-size: 1.3rem; color: var(--gold); display: block; margin-bottom: 6px; }
        .cat-btn span { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }

        .listing-area { max-height: 280px; overflow-y: auto; background: rgba(0,0,0,0.25); border-radius: 20px; padding: 10px; display: none; margin-bottom: 15px; }
        .list-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; border-radius: 12px; margin-bottom: 5px; transition: 0.2s; }
        .list-item:hover { background: rgba(255,255,255,0.05); }
        .list-item.active { border-left: 4px solid var(--gold); background: rgba(212,175,55,0.05); }
        .list-item b { display: block; font-size: 0.85rem; color: var(--gold); }
        .list-item p { font-size: 0.7rem; opacity: 0.6; margin: 4px 0 0 0; line-height: 1.4; }

        .custom-entry { margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }

        #map { width: 100%; height: 200px; border-radius: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        input, select { width: 100%; padding: 16px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; color: white; margin-bottom: 15px; font-family: inherit; font-size: 0.9rem; }
        input:focus { outline: none; border-color: var(--gold); }

        .nav-buttons { display: flex; gap: 12px; margin-top: 10px; }
        .btn-next { background: var(--gold); color: var(--navy); border: none; padding: 18px; border-radius: 15px; flex: 2; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 2px; }
        .btn-back { background: rgba(255,255,255,0.1); color: white; border: none; padding: 18px; border-radius: 15px; flex: 1; font-weight: 700; cursor: pointer; }

        .price-panel { text-align: center; padding: 20px; background: rgba(212,175,55,0.08); border: 1px solid var(--gold); border-radius: 20px; margin-top: 10px; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    </style>
</head>
<body>

<section class="hero">
    <h1>Cool Comfort</h1>
    <div class="motto">The Gold Standard of Jamaican Hospitality</div>
    
    <div class="booking-card">
        <div class="progress-bar">
            <div class="progress-line"></div>
            <div class="progress-fill" id="progress-fill"></div>
            <div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>

        <div class="step active">
            <span class="section-label">01. Choose Your Duration</span>
            <select id="days" onchange="updateFare()">
                <option value="1">1 Day Exploration</option>
                <option value="3">3 Day Island Escape</option>
                <option value="5">5 Day Tropical Retreat</option>
                <option value="7">7 Day Platinum Tour</option>
                <option value="10">10 Day Island Grandeur</option>
                <option value="14">14 Day Total Immersion</option>
            </select>
            <input type="date" id="res-date">
            <input type="time" id="res-time">
        </div>

        <div class="step">
            <span class="section-label">02. Curate Your Experience</span>
            <div class="category-grid">
                <div class="cat-btn" onclick="loadList('resorts', this)"><i class="fa-solid fa-hotel"></i><span>Stays</span></div>
                <div class="cat-btn" onclick="loadList('eats', this)"><i class="fa-solid fa-utensils"></i><span>Dining</span></div>
                <div class="cat-btn" onclick="loadList('falls', this)"><i class="fa-solid fa-water"></i><span>Waterfalls</span></div>
                <div class="cat-btn" onclick="loadList('views', this)"><i class="fa-solid fa-camera"></i><span>Landmarks</span></div>
            </div>
            
            <div id="list-area" class="listing-area"></div>

            <div class="custom-entry">
                <input type="text" id="custom-poi" placeholder="Or type a specific location / villa name" onkeyup="addCustomPOI(event)">
            </div>
        </div>

        <div class="step">
            <span class="section-label">03. Logistics & Location</span>
            <div id="map"></div>
            <input type="text" id="pickup" placeholder="Pickup Address (Hotel / Airport / Port)">
            <input type="text" id="destination" placeholder="Final Resort / Drop-off Point">
        </div>

        <div class="step">
            <span class="section-label">04. Final Quotation</span>
            <div class="price-panel">
                <div id="jmd-price" style="font-size: 2rem; font-weight: 700; color: var(--gold);">$0 JMD</div>
                <div id="usd-price" style="opacity: 0.6; font-size: 0.8rem;">≈ $0.00 USD</div>
            </div>
            <p style="text-align: center; font-size: 0.7rem; opacity: 0.6; margin-top: 15px;">Your reservation includes a dedicated concierge-trained chauffeur and 24/7 travel support.</p>
        </div>

        <div class="nav-buttons">
            <button class="btn-back" id="prevBtn" onclick="changeStep(-1)" style="display:none;">Back</button>
            <button class="btn-next" id="nextBtn" onclick="changeStep(1)">Continue</button>
        </div>
    </div>
</section>

<script>
    let step = 0, selectedPOIs = [];
    let map, ds, dr;

    const data = {
        resorts: [
            { n: "Round Hill Hotel & Villas", d: "Montego Bay. Timeless elegance and celebrity privacy." },
            { n: "Half Moon Resort", d: "Rose Hall. Massive estate with equestrian and golf facilities." },
            { n: "S Hotel Jamaica", d: "Montego Bay. Chic, urban boutique vibes on Doctor's Cave beach." },
            { n: "Trident Hotel", d: "Port Antonio. Ultra-modern luxury on a rocky coastline." },
            { n: "Geejam Hotel", d: "Port Antonio. Recording studio meets jungle luxury." },
            { n: "Rockhouse Hotel", d: "Negril. Boutique villas perched on the scenic cliffs." }
        ],
        eats: [
            { n: "Scotchies Jerk Center", d: "Montego Bay/Ocho Rios. The benchmark for pimento jerk." },
            { n: "Gloria's Seafood City", d: "Port Royal. Famous seafood with harbor views." },
            { n: "Miss T's Kitchen", d: "Ocho Rios. Rustic home-style Jamaican gourmet." },
            { n: "The Houseboat Grill", d: "Montego Bay. Fine dining on a lagoon-moored houseboat." },
            { n: "Zimbali Retreats", d: "Westmoreland. Farm-to-table organic mountain experience." },
            { n: "Rick's Cafe", d: "Negril. Cliff jumping, sunset cocktails, and global fame." }
        ],
        falls: [
            { n: "Dunn's River Falls", d: "Ocho Rios. The island's most iconic terraced waterfalls." },
            { n: "Blue Hole", d: "Ocho Rios. Hidden turquoise swimming holes and jumps." },
            { n: "YS Falls", d: "St. Elizabeth. Seven-tiered waterfalls in a lush estate." },
            { n: "Reach Falls", d: "Port Antonio. Virgin rain forest and emerald pools." },
            { n: "Mayfield Falls", d: "Westmoreland. River walk with 21 natural pools." },
            { n: "Somerset Falls", d: "Portland. Hidden cave waterfall accessed by boat." }
        ],
        views: [
            { n: "Bob Marley Museum", d: "Kingston. The legendary home of the Reggae King." },
            { n: "Rose Hall Great House", d: "Montego Bay. Historic 18th-century haunted plantation." },
            { n: "Devon House", d: "Kingston. Iconic mansion and the world's best ice cream." },
            { n: "Luminous Lagoon", d: "Falmouth. Natural bioluminescent waters at night." },
            { n: "Blue Mountains", d: "World-class coffee peaks and hiking trails." },
            { n: "Seven Mile Beach", d: "Negril. The gold standard for white-sand sunsets." }
        ]
    };

    function changeStep(n) {
        const steps = document.querySelectorAll('.step');
        steps[step].classList.remove('active');
        step += n;
        
        if (step >= steps.length) {
            submit();
            step = steps.length - 1;
        }

        steps[step].classList.add('active');
        updateUI();
    }

    function updateUI() {
        const dots = document.querySelectorAll('.dot');
        document.getElementById('progress-fill').style.width = (step / (dots.length - 1)) * 100 + "%";
        dots.forEach((d, i) => d.classList.toggle('active', i <= step));
        
        document.getElementById('prevBtn').style.display = step === 0 ? 'none' : 'block';
        document.getElementById('nextBtn').innerText = step === 3 ? "Send Reservation" : "Continue";

        if (step === 2) setTimeout(initMap, 50);
    }

    function loadList(cat, el) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        const area = document.getElementById('list-area');
        area.style.display = 'block';
        area.innerHTML = data[cat].map(item => `
            <div class="list-item ${selectedPOIs.includes(item.n) ? 'active' : ''}" onclick="togglePOI('${item.n}', this)">
                <b>${item.n}</b><p>${item.d}</p>
            </div>
        `).join('');
    }

    function togglePOI(name, el) {
        if (selectedPOIs.includes(name)) {
            selectedPOIs = selectedPOIs.filter(i => i !== name);
            el.classList.remove('active');
        } else {
            selectedPOIs.push(name);
            el.classList.add('active');
        }
    }

    function addCustomPOI(e) {
        if (e.key === 'Enter') {
            const val = e.target.value.trim();
            if (val && !selectedPOIs.includes(val)) {
                selectedPOIs.push(val);
                e.target.value = "";
                alert("Destination Added: " + val);
            }
        }
    }

    function initMap() {
        if (map) return;
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 10, center: { lat: 18.2, lng: -77.3 }, mapTypeId: 'hybrid', disableDefaultUI: true
        });
        ds = new google.maps.DirectionsService();
        dr = new google.maps.DirectionsRenderer({ map, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 5 } });
        setupAC(document.getElementById('pickup'));
        setupAC(document.getElementById('destination'));
    }

    function setupAC(input) {
        const ac = new google.maps.places.Autocomplete(input, { componentRestrictions: { country: "jm" } });
        ac.addListener('place_changed', updateFare);
    }

    function updateFare() {
        const p = document.getElementById('pickup').value;
        const d = document.getElementById('destination').value;
        if (!p || !d) return;

        ds.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (res, stat) => {
            if (stat === "OK") {
                dr.setDirections(res);
                const km = res.routes[0].legs[0].distance.value / 1000;
                const total = Math.round(((600 + (km * 155)) * document.getElementById('days').value) / 10) * 10;
                document.getElementById('jmd-price').innerText = `$${total.toLocaleString()} JMD`;
                document.getElementById('usd-price').innerText = `≈ $${(total / 156).toFixed(2)} USD`;
            }
        });
    }

    function submit() {
        const text = `*COOL COMFORT RESERVATION*\n\nTimeline: ${document.getElementById('days').value} Days\nSchedule: ${document.getElementById('res-date').value} @ ${document.getElementById('res-time').value}\n\nObjectives:\n- ${selectedPOIs.join('\n- ')}\n\nPickup: ${document.getElementById('pickup').value}\nFinal Destination: ${document.getElementById('destination').value}\n\nEstimated Total: ${document.getElementById('jmd-price').innerText}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(text)}`);
    }
</script>
</body>
</html>
