<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Comfort | The Gold Standard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZuIwI0J-NdnVMzachSB41NZsayKUuOMU&libraries=places"></script>
    
    <style>
        :root { --gold: #d4af37; --navy: #001f26; --glass: rgba(255, 255, 255, 0.08); --white: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--navy); color: var(--white); overflow-x: hidden; }

        .hero { min-height: 100vh; background: linear-gradient(rgba(0,31,38,0.85), rgba(0,31,38,0.95)), url('Cover Photo.jpg'); background-size: cover; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 40px 20px; }
        
        .header-content { text-align: center; margin-bottom: 40px; }
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 6vw, 4rem); color: var(--gold); margin: 0; letter-spacing: 4px; text-transform: uppercase; }
        .motto { letter-spacing: 6px; font-size: 0.8rem; opacity: 0.8; text-transform: uppercase; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); padding: 5px 20px; display: inline-block; margin-top: 10px; }

        .booking-card { background: var(--glass); backdrop-filter: blur(35px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 40px; width: 100%; max-width: 550px; box-shadow: 0 50px 100px rgba(0,0,0,0.7); }

        /* Progress System */
        .progress-bar { display: flex; justify-content: space-between; margin-bottom: 30px; position: relative; }
        .progress-line { position: absolute; top: 50%; left: 0; height: 1px; background: rgba(255,255,255,0.1); width: 100%; z-index: 1; transform: translateY(-50%); }
        .progress-fill { position: absolute; top: 50%; left: 0; height: 1px; background: var(--gold); width: 0%; z-index: 2; transition: 0.6s; transform: translateY(-50%); }
        .dot { width: 10px; height: 10px; background: #222; border-radius: 50%; z-index: 3; transition: 0.4s; }
        .dot.active { background: var(--gold); box-shadow: 0 0 15px var(--gold); }

        /* Step Content */
        .step { display: none; animation: slideUp 0.5s ease; }
        .step.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .section-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); margin-bottom: 20px; display: block; text-align: center; }

        /* Experience Directory */
        .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .cat-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .cat-btn:hover, .cat-btn.selected { border-color: var(--gold); background: rgba(212,175,55,0.1); }
        .cat-btn i { font-size: 1.5rem; color: var(--gold); display: block; margin-bottom: 8px; }
        .cat-btn span { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }

        .listing-scroll { max-height: 250px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 20px; padding: 10px; display: none; }
        .list-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; border-radius: 12px; margin-bottom: 5px; }
        .list-item:hover { background: rgba(255,255,255,0.05); }
        .list-item.active { border-left: 4px solid var(--gold); background: rgba(212,175,55,0.05); }
        .list-item b { display: block; font-size: 0.9rem; color: var(--gold); }
        .list-item p { font-size: 0.7rem; opacity: 0.6; margin: 5px 0 0 0; line-height: 1.4; }

        #map { width: 100%; height: 180px; border-radius: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        input, select { width: 100%; padding: 18px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; color: white; margin-bottom: 15px; font-family: inherit; }

        /* Navigation */
        .nav-buttons { display: flex; gap: 15px; margin-top: 20px; }
        .btn-next { background: var(--gold); color: var(--navy); border: none; padding: 20px; border-radius: 18px; flex: 2; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 2px; }
        .btn-back { background: rgba(255,255,255,0.1); color: white; border: none; padding: 20px; border-radius: 18px; flex: 1; font-weight: 700; cursor: pointer; }

        .price-panel { text-align: center; padding: 20px; background: rgba(212,175,55,0.1); border: 1px solid var(--gold); border-radius: 20px; margin-top: 10px; }
    </style>
</head>
<body>

<section class="hero">
    <div class="header-content">
        <h1>Cool Comfort</h1>
        <div class="motto">Premium Jamaican Concierge & Transit</div>
    </div>
    
    <div class="booking-card">
        <div class="progress-bar">
            <div class="progress-line"></div>
            <div class="progress-fill" id="progress-fill"></div>
            <div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>

        <div class="step active">
            <span class="section-label">01. Journey Timeline</span>
            <select id="days" onchange="updateFare()">
                <option value="1">Single Day Excursion</option>
                <option value="3">3-Day Coastal Tour</option>
                <option value="7">7-Day Island Grandeur</option>
            </select>
            <input type="date" id="res-date">
            <input type="time" id="res-time">
        </div>

        <div class="step">
            <span class="section-label">02. Explore the Island</span>
            <div class="category-grid">
                <div class="cat-btn" onclick="showCategory('stays', this)"><i class="fa-solid fa-hotel"></i><span>Luxury Stays</span></div>
                <div class="cat-btn" onclick="showCategory('dining', this)"><i class="fa-solid fa-utensils"></i><span>Fine Dining</span></div>
                <div class="cat-btn" onclick="showCategory('nature', this)"><i class="fa-solid fa-water"></i><span>Nature</span></div>
                <div class="cat-btn" onclick="showCategory('culture', this)"><i class="fa-solid fa-landmark"></i><span>Heritage</span></div>
            </div>
            <div id="listing-area" class="listing-scroll"></div>
        </div>

        <div class="step">
            <span class="section-label">03. Arrival Details</span>
            <div id="map"></div>
            <input type="text" id="pickup" placeholder="Enter Pickup Address">
            <input type="text" id="destination" placeholder="Enter Drop-off Point">
        </div>

        <div class="step">
            <span class="section-label">04. Reservation Summary</span>
            <div class="price-panel">
                <div id="jmd-price" style="font-size: 2rem; font-weight: 700; color: var(--gold);">$0 JMD</div>
                <div id="usd-price" style="opacity: 0.6; font-size: 0.8rem;">≈ $0.00 USD</div>
            </div>
            <p style="text-align: center; font-size: 0.7rem; opacity: 0.6; margin-top: 15px;">Your chauffeured experience includes real-time GPS tracking and 24/7 concierge support.</p>
        </div>

        <div class="nav-buttons">
            <button class="btn-back" id="prevBtn" onclick="changeStep(-1)" style="display:none;">Back</button>
            <button class="btn-next" id="nextBtn" onclick="changeStep(1)">Continue</button>
        </div>
    </div>
</section>

<script>
    let currentStep = 0, missionDays = 1, selectedPOIs = [];
    let map, ds, dr;

    const directory = {
        stays: [
            { n: "Round Hill Hotel & Villas", d: "Historic luxury peninsula in Montego Bay. Timeless elegance." },
            { n: "S Hotel Jamaica", d: "Chic boutique stay on the famous Doctor's Cave beach." },
            { n: "Half Moon Resort", d: "Iconic 400-acre estate with private villas and equestrian center." }
        ],
        dining: [
            { n: "Scotchies Jerk Center", d: "Authentic pimento-wood smoked jerk chicken and pork." },
            { n: "Gloria's Seafood City", desc: "Premium fresh catch with historic harbor views." },
            { n: "The Houseboat Grill", desc: "Unique floating dining experience in the Montego Bay Lagoon." }
        ],
        nature: [
            { n: "Dunn's River Falls", d: "Climb Jamaica's most iconic terraced waterfalls." },
            { n: "Reach Falls", d: "A secluded hidden gem surrounded by lush rain forest." },
            { n: "Blue Hole", d: "Deep turquoise natural lagoons and limestone jumps." }
        ],
        culture: [
            { n: "Bob Marley Museum", d: "The legendary home and recording studio of the King of Reggae." },
            { n: "Rose Hall Great House", d: "Chilling 18th-century heritage and the White Witch legend." }
        ]
    };

    function changeStep(n) {
        const steps = document.querySelectorAll('.step');
        steps[currentStep].classList.remove('active');
        currentStep += n;
        
        if (currentStep >= steps.length) {
            sendWhatsApp();
            currentStep = steps.length - 1;
        }

        steps[currentStep].classList.add('active');
        updateUI();
    }

    function updateUI() {
        const dots = document.querySelectorAll('.dot');
        document.getElementById('progress-fill').style.width = (currentStep / (dots.length - 1)) * 100 + "%";
        dots.forEach((d, i) => d.classList.toggle('active', i <= currentStep));
        
        document.getElementById('prevBtn').style.display = currentStep === 0 ? 'none' : 'block';
        document.getElementById('nextBtn').innerText = currentStep === 3 ? "Complete Reservation" : "Continue";

        if (currentStep === 2) setTimeout(initMap, 100);
    }

    function showCategory(cat, el) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        const area = document.getElementById('listing-area');
        area.style.display = 'block';
        area.innerHTML = directory[cat].map(item => `
            <div class="list-item ${selectedPOIs.includes(item.n) ? 'active' : ''}" onclick="togglePOI('${item.n}', this)">
                <b>${item.n}</b><p>${item.d}</p>
            </div>
        `).join('');
    }

    function togglePOI(name, el) {
        if (selectedPOIs.includes(name)) {
            selectedPOIs = selectedPOIs.filter(i => i !== name);
            el.classList.remove('active');
        } else {
            selectedPOIs.push(name);
            el.classList.add('active');
        }
    }

    function initMap() {
        if (map) return;
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 10, center: { lat: 18.1096, lng: -77.2975 }, mapTypeId: 'hybrid', disableDefaultUI: true
        });
        ds = new google.maps.DirectionsService();
        dr = new google.maps.DirectionsRenderer({ map, polylineOptions: { strokeColor: "#d4af37", strokeWeight: 5 } });
        setupAC(document.getElementById('pickup'));
        setupAC(document.getElementById('destination'));
    }

    function setupAC(input) {
        const ac = new google.maps.places.Autocomplete(input, { componentRestrictions: { country: "jm" } });
        ac.addListener('place_changed', updateFare);
    }

    function updateFare() {
        const p = document.getElementById('pickup').value;
        const d = document.getElementById('destination').value;
        if (!p || !d) return;

        ds.route({ origin: p, destination: d, travelMode: 'DRIVING' }, (res, stat) => {
            if (stat === "OK") {
                dr.setDirections(res);
                const km = res.routes[0].legs[0].distance.value / 1000;
                const total = Math.round(((600 + (km * 155)) * document.getElementById('days').value) / 10) * 10;
                document.getElementById('jmd-price').innerText = `$${total.toLocaleString()} JMD`;
                document.getElementById('usd-price').innerText = `≈ $${(total / 156).toFixed(2)} USD`;
            }
        });
    }

    function sendWhatsApp() {
        const text = `*NEW LUXURY RESERVATION*\n\nDate: ${document.getElementById('res-date').value}\nTime: ${document.getElementById('res-time').value}\nPoints of Interest: ${selectedPOIs.join(', ') || 'Custom Route'}\nPickup: ${document.getElementById('pickup').value}\nDrop-off: ${document.getElementById('destination').value}\nEstimated Total: ${document.getElementById('jmd-price').innerText}`;
        window.open(`https://wa.me/18763933246?text=${encodeURIComponent(text)}`);
    }
</script>
</body>
</html>
